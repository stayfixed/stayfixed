# A project every gate passes on: the smoke workflow's caller, and `check.yml`'s
# same-repository and cross-repository forms both run against it. Hand-written on purpose:
# `init` writes no `enforced`, and a gate enforces only when that list names it, so the list
# below names every configured gate, which is what makes each one enforce against this fixture.
# Its version is written by hand; `doctor` warns when it drifts from the stayfixed running, and
# nothing fails.
[stayfixed]
version = "0.1.0"
enforced = ["docs", "bugs", "plan", "commit", "trail"]

[project]
name = "smoke"
base_branch = "main"

# A real store, so the six `memory session-context` entries in `hooks/hooks.json` carry
# repository bytes toward the model instead of exiting 0 on a project that has none.
# `scripts/smoke_hooks.py` asserts what each bundle emitted: the volatile note as data, and
# no standing rule; before this block every one of those rows was green against a store that
# did not exist.
[memory]
mode = "in-repo"
groups = ["developer", "volatile"]
