# A project every gate passes on: the smoke workflow's caller, and `check.yml`'s
# same-repository and cross-repository forms both run against it. Hand-written on purpose:
# `init` writes `state = "initialised"`, and the `installed` below is what makes every
# configured gate enforce against this fixture. Its version is written by hand; `doctor` warns
# when it drifts from the stayfixed running, and nothing fails.
[stayfixed]
version = "0.1.0"
state = "installed"

[project]
name = "smoke"
base_branch = "main"

# A real store, so the six `memory session-context` entries in `hooks/hooks.json` carry
# repository bytes toward the model instead of exiting 0 on a project that has none.
# `scripts/smoke_hooks.py` records the owner's trust for it and then asserts what each
# bundle emitted; before this block every one of those rows was green against a store that
# did not exist.
[memory]
mode = "in-repo"
groups = ["developer", "volatile"]
