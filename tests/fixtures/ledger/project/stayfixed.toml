# The project `tests/ledger/test_literals.py` copies into a fresh repository and runs the `bugs`
# commands against, holding what they print and write to the bytes they printed and wrote before
# the register engine learnt a list field. `broken/` holds the files its broken variant lays over
# this tree: each of four findings once.
[stayfixed]
version = "0.1.0"
enforced = ["docs", "bugs", "plan", "commit", "trail"]

[project]
name = "ledger"
base_branch = "main"
