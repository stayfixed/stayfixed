# .github/workflows/release.yml
#
# The first upload would otherwise have been a hand-run `uv publish` from a laptop, with no
# provenance and an API token sitting in somebody's shell history. This publishes from the tag,
# authenticates with a short-lived OIDC token through PyPI's Trusted Publishing, and attaches
# build attestations — so there is no secret to leak and the artefact says where it came from.
#
# See RELEASING.md for the one-time PyPI registration and the `pypi` environment this needs.
name: release

on:
  push:
    # Semver tags only, and deliberately not `v*`: the floating `v1` alias matches `v*`, so
    # every alias move would start a run that `scripts/release.py check --tag v1` fails — for
    # the life of the project. The alias points at a release this workflow already published.
    #
    # Finals only, and the prerelease pattern that stood beside this one is gone. It admitted
    # `v0.1.0-rc1` while `gh release create` below carries no `--prerelease`, so an rc would
    # have become the repository's "Latest" Release; and it could not have got that far anyway,
    # because `scripts/release.py check --tag` compares the tag to `pyproject.toml`'s literal
    # version and `uv.lock` normalises `0.1.0-rc1` to `0.1.0rc1`, which the seven-source rule then
    # reads as two different versions. A trigger for a release this project cannot cut is a
    # trigger that only fires by accident. RELEASING.md section 2, step 6, says the same thing to
    # the person tagging.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # Read-only, and nothing here can sign: the suite and every dependency the lock installs run
    # in this job, so the OIDC token an attestation is signed with is `attest`'s, below, which
    # runs neither.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # The release commit and its first parent: `release.py check --tag` reads the plugin
        # commit the first parent pins, which is the release's plugin commit's parent, and in a
        # clone of one commit it refuses, naming this setting, rather than read it as none.
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Version discipline, against the tag
        # The tag is the claim; the seven sources, the changelog and the hash record are what
        # the claim has to agree with, and `scripts/release.py check --tag` holds all of them. A
        # tag that names a version no source carries is the one release mistake PyPI will not let
        # you undo. It also refuses a plugin tree over the plugin directory's file count, which
        # `tests/test_payload.py` holds on every pull request as well, and a marketplace entry
        # whose `sha` is not the plugin commit the release commit's tree makes.
        run: uv run python scripts/release.py check --tag "$GITHUB_REF_NAME"
      - name: Tests
        run: uv run pytest -q
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # The one job that signs. The attestations are signed with this job's OIDC token and written
  # with its `attestations: write`, so it runs no suite, installs nothing and keeps no token in
  # the checkout: it runs this repository's own `scripts/plugin_tree.py` on the runner's
  # interpreter, importing the checkout's own `src`, and the two actions that attest and upload.
  #
  # The plugin is published from a repository of its own, whose commit is a function of this
  # one: `plugin_tree.py commit` computes it, and `--require-pin` refuses a release commit whose
  # marketplace entry pins another `sha`. The id is handed on as `commit`, which the jobs behind
  # the approval wait for; the owner pushes it with `scripts/publish_plugin.py`, which checks
  # the manifest attested here. `GITHUB_SHA` and not `HEAD`: it is the attestation's source
  # digest, so the commit read, the digest attested and the commit the publisher checks are one
  # value.
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: read
    outputs:
      commit: ${{ steps.plugin-commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: The plugin commit of the commit this run builds
        id: plugin-commit
        env:
          PYTHONPATH: src
        run: |
          python3 scripts/plugin_tree.py commit --root . --rev "$GITHUB_SHA" \
            --git-dir "$RUNNER_TEMP/plugin.git" --manifest-file "$RUNNER_TEMP/plugin-tree.txt" \
            --require-pin --json > "$RUNNER_TEMP/plugin-commit.json"
          commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$RUNNER_TEMP/plugin-commit.json")"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::plugin_tree.py commit named no plugin commit: '$commit'"
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # The artefacts a GitHub Release carries say where they came from whether or not PyPI is
        # in the picture, so a declined PyPI does not cost the provenance.
        with:
          subject-path: "dist/*"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        # The plugin tree's manifest, attested on its own: one line per file, its mode, its
        # sha256 and its path, the tree of the commit handed on above.
        with:
          subject-path: ${{ runner.temp }}/plugin-tree.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-tree
          path: ${{ runner.temp }}/plugin-tree.txt
          # The action's default is a warning, and a missing manifest must stop the release here
          # rather than at `github-release`, behind the approval.
          if-no-files-found: error

  # The one gate on this file's two irreversible acts that is not prose. GitHub **auto-creates**
  # an environment a job names and the repository does not have, with no protection rules on it,
  # so `environment: pypi` below reads like a human gate whether or not one exists: a first
  # release cut before RELEASING.md section 3 would upload to PyPI — which cannot be retracted —
  # and publish a GitHub Release, with nobody asked and nothing failing. A sentence in RELEASING.md
  # is the wrong medium for that, so here it is as a check.
  #
  # One job rather than a first step copied into each of the two that name the environment. Two
  # byte-identical scripts in one file drift, and the property that has to hold is not "this job
  # checked" but "every job that names the environment waited for the check" — which is a claim
  # about the file, is asserted over the file in `tests/test_fixtures.py`, and covers the third
  # such job nobody has written yet. The check runs before any approval is asked for, which is
  # the only time it can run at all: the case it exists for is the one where GitHub asks nobody.
  environment-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The pypi environment is a gate and not a name GitHub invented
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          # The environment this gate is about. `tests/test_fixtures.py` holds it equal to the
          # `environment:` every gated job names, so renaming one and not the other reddens
          # rather than leaving this job checking a name nothing uses.
          ENVIRONMENT: pypi
          # The fallback, and the one question it is allowed to answer.
          # `GET /repos/OWNER/REPO/environments/NAME` is not readable by every default
          # token, and a gate that fails closed on a permission it may never be granted is a
          # gate that blocks every release forever. So a repository variable — which only an
          # administrator can set and no pull request can write — may stand in for the READ,
          # and never for the ANSWER: an environment that reads back with zero rules fails
          # below whatever this says.
          DECLARED: ${{ vars.PYPI_ENVIRONMENT_PROTECTED }}
        run: |
          rules="$(gh api "repos/$REPOSITORY/environments/$ENVIRONMENT" \
            --jq '.protection_rules | length' 2>/dev/null || true)"
          case "$rules" in
            ''|*[!0-9]*)
              if [ "$DECLARED" = "true" ]; then
                echo "::warning::$ENVIRONMENT's protection rules could not be read; the repository variable PYPI_ENVIRONMENT_PROTECTED stands in for the read"
                exit 0
              fi
              echo "::error::$ENVIRONMENT's protection rules could not be read, and the repository variable PYPI_ENVIRONMENT_PROTECTED does not say it is a gate; see RELEASING.md section 3"
              exit 1
              ;;
          esac
          if [ "$rules" -eq 0 ]; then
            echo "::error::the $ENVIRONMENT environment has no protection rules, so GitHub created it on the spot and nothing is waiting for an approval; see RELEASING.md section 3"
            exit 1
          fi
          echo "$ENVIRONMENT has $rules protection rule(s); the gate is real"

  # Each job behind the approval starts by asking the plugin repository whether its tag names the
  # commit `attest` computed, before it checks anything out or downloads anything, so an
  # approval given before the owner published the plugin does nothing irreversible: the job
  # fails, the owner publishes, and the job is re-run. The tag is listed by both its names and
  # each line is selected by its whole ref name, because `ls-remote` matches a pattern against
  # the tail of a name and so also lists `refs/tags/x/refs/tags/vX.Y.Z`; the `^{}` line, when
  # the tag is annotated, is the commit it names. A step in each gated job and not a job of its
  # own, which would ask for a second approval; `tests/test_check_workflow.py` holds the two
  # copies equal. No credential: the plugin repository is public.
  publish:
    needs: [build, environment-gate, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The last human gate. A tag pushed by mistake waits for an approval here instead of
    # becoming a permanent PyPI release — and `environment-gate` above is what makes that
    # true rather than hopeful, because an environment with no rules asks nobody.
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing: no stored API token anywhere
      contents: read
    steps:
      - name: The plugin repository holds this release's commit
        env:
          TAG: ${{ github.ref_name }}
          PINNED: ${{ needs.attest.outputs.commit }}
        run: |
          listing="$(git ls-remote https://github.com/stayfixed/stayfixed-plugin.git "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "::error::stayfixed/stayfixed-plugin could not be listed; re-run this job, or see RELEASING.md section 2, step 7"
            exit 1
          }
          tagged=""
          peeled=""
          while IFS=$'\t' read -r id ref; do
            case "$ref" in
              "refs/tags/$TAG") tagged="$id" ;;
              "refs/tags/$TAG^{}") peeled="$id" ;;
            esac
          done <<< "$listing"
          found="${peeled:-$tagged}"
          if ! [[ "$PINNED" =~ ^[0-9a-f]{40}$ ]] || [ "$found" != "$PINNED" ]; then
            echo "::error::stayfixed/stayfixed-plugin's $TAG names ${found:-no commit}, not the plugin commit '$PINNED' this release pins: publish it as RELEASING.md section 2, step 7 says, then re-run this job"
            exit 1
          fi
          echo "stayfixed/stayfixed-plugin's $TAG is the plugin commit this release pins, $PINNED"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Independent of `publish`, so a failed PyPI upload does not cost the Release —
  # and behind the same `pypi` environment, because the environment is the one human gate this
  # file has and a mistaken tag must not become a public Release either.
  github-release:
    needs: [build, environment-gate, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi   # the same human gate as publish: a mistaken tag waits here too
    permissions:
      contents: write   # the one job that writes: a Release attached to vX.Y.Z, never to v1
    steps:
      - name: The plugin repository holds this release's commit
        env:
          TAG: ${{ github.ref_name }}
          PINNED: ${{ needs.attest.outputs.commit }}
        run: |
          listing="$(git ls-remote https://github.com/stayfixed/stayfixed-plugin.git "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "::error::stayfixed/stayfixed-plugin could not be listed; re-run this job, or see RELEASING.md section 2, step 7"
            exit 1
          }
          tagged=""
          peeled=""
          while IFS=$'\t' read -r id ref; do
            case "$ref" in
              "refs/tags/$TAG") tagged="$id" ;;
              "refs/tags/$TAG^{}") peeled="$id" ;;
            esac
          done <<< "$listing"
          found="${peeled:-$tagged}"
          if ! [[ "$PINNED" =~ ^[0-9a-f]{40}$ ]] || [ "$found" != "$PINNED" ]; then
            echo "::error::stayfixed/stayfixed-plugin's $TAG names ${found:-no commit}, not the plugin commit '$PINNED' this release pins: publish it as RELEASING.md section 2, step 7 says, then re-run this job"
            exit 1
          fi
          echo "stayfixed/stayfixed-plugin's $TAG is the plugin commit this release pins, $PINNED"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-tree
          path: ${{ runner.temp }}/plugin-tree
      - name: The release's own changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY' > "$RUNNER_TEMP/notes.md"
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = sys.argv[1]
          match = re.search(rf"^## {re.escape(version)} .*?(?=^## |\Z)", text, re.S | re.M)
          assert match, f"CHANGELOG.md has no section for {version}"
          print(match.group(0).strip())
          PY
      - name: The GitHub Release, attached to this tag only
        # Never attached to the floating `v1`: GitHub's immutable releases would freeze the
        # alias at whatever it pointed to, and the alias exists to move. The plugin tree's
        # manifest rides beside `dist/*`, so anyone can compare the plugin repository's tag
        # against the file this run attested.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "stayfixed ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" dist/* "$RUNNER_TEMP/plugin-tree/plugin-tree.txt"
