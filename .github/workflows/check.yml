# The reusable workflow a project calls. One job, `gates`: it checks out the caller, checks out
# stayfixed at THIS FILE's own commit (no resolver and no build backend; the network is the two
# checkouts, whatever `setup-python` below fetches when the runner has no matching interpreter
# cached, and, on a pull request that moves `[ci] ref`, one listing of stayfixed's release tags),
# and runs `python3 -P -s -m stayfixed gate` twice, handing it the platform's raw values for the
# base and the project root, which it checks and resolves itself. The first run reads the base's
# `stayfixed.toml`, admits only a change that tightens it, and runs the configuration check and
# the built-in gates, each advisory or enforcing as the configuration it admitted says; it
# executes nothing the repository wrote.
# The second runs the project's own gates from `[gates.custom]`, only once the first passed:
# those commands execute files the pull request can change, with the runner's privileges, and
# must never share a process with the verdict. One job and not one per gate because a job is
# billed by the whole minute, so this spends one runner-minute per push instead of one per
# gate; a caller that wants a check row per gate calls this file from a matrix of its own and
# passes `only:`. Every value that reaches a shell here arrives through `env:`; a `${{ }}`
# spliced into `run:` is a command injection waiting for a ref name that permits it.
#
# **Anchor provenance, said once.** Every check here is Python's, in `stayfixed gate`
# (`stayfixed.assess.base`), where a shell step used to make them; this file only hands the
# values over, each as one `--name=value` argument.
# - The base branch's NAME is the pull request's base as the platform reports it
#   (`github.base_ref`); the caller's `base:` decides only on events that report none, and on a
#   pull request a `base:` that disagrees is refused. The caller `stayfixed init` writes runs
#   only for pull requests into the gate branch and passes that branch as a literal `base:`,
#   so a pull request retargeted at a looser branch produces no run at all. The caller file is
#   pull-request content, so all of that holds only under the repository settings
#   `docs/cli.md#the-reusable-workflow` names: CODEOWNERS on `/.github/` with a required review.
# - The base COMMIT is `refs/remotes/origin/<base>` in the caller's own checkout, which each gate
#   step resolves once to a full sha that every later read in that step uses. A fully qualified
#   name is never shadowed by a tag called `origin/<base>`. The two steps resolve the same
#   commit: one checkout, with every branch fetched by the first step and no token left to fetch
#   with, and nothing between the two steps that fetches.
# - The project ROOT is `path:` inside the caller's checkout, and a `path:` with a `..` component
#   or an absolute one is refused, so it cannot point the gates at another checkout's
#   configuration. The platform reports no answer to compare `path:` against, so what protects
#   the value itself is the same CODEOWNERS review.
# - The stayfixed that runs comes from the platform's own record of which reusable workflow is
#   executing (`job.workflow_repository`, `job.workflow_sha`), never from the caller's inputs.
#   That record names what the caller's `uses:` line pinned, and that line is pull-request
#   content under the same settings. The platform documents no `github.job_workflow_sha`; an
#   undefined property is the empty string, and `actions/checkout` with an empty `ref` checks
#   out the DEFAULT BRANCH, a pin silently turned into a floating ref, so the checkout it got
#   is asserted rather than trusted.
name: stayfixed-check

on:
  workflow_call:
    inputs:
      base:
        description: "the branch the gates' configuration is read from; empty means the pull request's base, or the repository's default branch on a push"
        type: string
        default: ""
      path:
        description: "the project root inside the caller's checkout, as a relative path with no '..' component"
        type: string
        default: "."
      python-version:
        description: "the interpreter stayfixed runs on; 3.11 is the floor"
        type: string
        default: "3.13"
      only:
        description: "the checks to run, space-separated: `config` and any configured gate name. Empty runs the configuration check and every configured gate, and the configuration check runs whatever this names. A caller that wants one check row per gate passes one name per leg of its own matrix"
        type: string
        default: ""
      timeout-minutes:
        description: "the job's time limit in minutes, handed to the runner as given"
        type: number
        default: 15

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - name: The caller's repository
        # `fetch-depth: 0` is not a convenience: the base ref, the merge bases `plan check` and
        # `bugs check` read and the commit range `commit check` reads all come out of this
        # checkout, which must not be shallow, and `persist-credentials: false` means there is
        # no token to fetch them with afterwards.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: stayfixed, at this workflow's own commit
        # The `job.workflow_*` properties are unavailable on GitHub Enterprise Server.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: stayfixed
          persist-credentials: false
      - name: The checkout is the commit this workflow file is at
        # The assertion that would have caught an empty `ref`: a default-branch checkout
        # answers a different sha. It is also the only thing that turns the Enterprise Server
        # gap above into a refusal rather than into a floating stayfixed.
        #
        # A caller whose `uses:` names an annotated tag gets the tag object's sha here, not the
        # commit's, and the checkout lands on the commit; `v0.1.0` was tagged that way and every
        # run pinned to it refused. So the sha is peeled to the commit it names, and that commit,
        # not the platform's raw value, is what the gate steps are handed. An empty value names
        # nothing and is still refused.
        id: stayfixed
        env:
          EXPECTED: ${{ job.workflow_sha }}
        run: |
          expected="$(git -C stayfixed rev-parse --verify --quiet "$EXPECTED^{commit}")" || { echo "::error::the workflow's own ref '$EXPECTED' names no commit in the checkout"; exit 1; }
          actual="$(git -C stayfixed rev-parse HEAD)"
          [ "$actual" = "$expected" ] || { echo "::error::checked out $actual, not the workflow's own $expected"; exit 1; }
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: stayfixed runs at all
        # First, so that a stayfixed that cannot run fails here under its own name, and not as
        # a gate that reads as if it had found something. A bad checkout, a renamed module, or
        # an interpreter below the 3.11 floor (which `inputs.python-version` can name and
        # nothing validates) all land here.
        env:
          PYTHONPATH: stayfixed/src
        run: python3 -m stayfixed --version
      # The step that judges. `--builtin` executes no command from `stayfixed.toml`, and `-P -s`
      # put neither the working directory nor the user site directory on `sys.path`, so nothing
      # the pull request wrote runs in the process that holds the verdict. It may not fail
      # quietly: `stayfixed gate` already exits 0 for an advisory gate's findings, so
      # `continue-on-error` here could only turn a refusal or an enforced gate's failure green.
      # `only:` is split on whitespace and never globbed, and each name travels as `--only=NAME`,
      # so it is always that flag's value, whatever it looks like; `--builtin` runs the
      # configuration check whatever `only:` names, so a leg that names one gate still judges the
      # change's `stayfixed.toml` against the base's. The base and the project root arrive as the
      # platform's raw values, and `stayfixed gate` checks and resolves them before any gate runs;
      # the process stays in the workspace, which the pull request writes nothing into, and
      # `--root project` names the caller's checkout.
      - name: The configuration and the built-in gates
        env:
          PYTHONPATH: stayfixed/src
          INPUT_BASE: ${{ inputs.base }}
          INPUT_PATH: ${{ inputs.path }}
          PR_BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ steps.stayfixed.outputs.sha }}
          ONLY: ${{ inputs.only }}
        run: |
          set -f
          only=()
          for name in $ONLY; do only+=("--only=$name"); done
          set +f
          python3 -P -s -m stayfixed gate --builtin --root project \
            --pr-base="$PR_BASE" --base-input="$INPUT_BASE" \
            --default-branch="$DEFAULT_BRANCH" --path="$INPUT_PATH" \
            --workflow-sha "$WORKFLOW_SHA" --annotate --summary "$GITHUB_STEP_SUMMARY" "${only[@]}"
      # The commands `[gates.custom]` names, and only after the step above passed: under the
      # default `if: success()` they never run after a refusal or an enforced built-in's failure,
      # and never `if: always()`. They execute files the pull request can change, with the
      # runner's privileges, so by the time they run the verdict is out of their reach and only
      # their own results are left to them. The runner image and the interpreter above are all
      # they get: a command that needs the project's toolchain installs it itself. `only:` is read
      # as in the step above. `PYTHONPATH` is absolute here because each command runs from the
      # project root: a `python3 -m stayfixed` one of them starts resolves a relative entry against
      # the caller's checkout and finds no stayfixed, where this one finds the workflow's own.
      - name: The project's own gates
        env:
          PYTHONPATH: ${{ github.workspace }}/stayfixed/src
          INPUT_BASE: ${{ inputs.base }}
          INPUT_PATH: ${{ inputs.path }}
          PR_BASE: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_SHA: ${{ steps.stayfixed.outputs.sha }}
          ONLY: ${{ inputs.only }}
        run: |
          set -f
          only=()
          for name in $ONLY; do only+=("--only=$name"); done
          set +f
          python3 -P -s -m stayfixed gate --custom --root project \
            --pr-base="$PR_BASE" --base-input="$INPUT_BASE" \
            --default-branch="$DEFAULT_BRANCH" --path="$INPUT_PATH" \
            --workflow-sha "$WORKFLOW_SHA" --annotate --summary "$GITHUB_STEP_SUMMARY" "${only[@]}"
