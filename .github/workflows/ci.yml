# .github/workflows/ci.yml
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch, and the newest is the one that counts. A branch that pushes three commits
# to an open pull request in five minutes queues three full matrices, and nobody reads the
# first two answers — measured on this repository: `wp/fsops` alone ran six times. Never on
# `main`: that run is the record that the branch everyone pulls is green, and the next push
# must not cancel it. Public repositories are not billed for standard runners, so this buys
# queue time and clarity rather than money.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change reaches, read once for every job below. A pull request that changes nothing
  # outside `docs/` runs the suite on one leg, `ubuntu-latest` with 3.13, and skips the rest: the
  # documents ship in no artifact and no plugin tree (`scripts/plugin_tree.py`'s `PLUGIN_PATHS`),
  # yet tests read them — `docs/cli.md` is held to the parser, and every tracked file to the
  # neutrality and anchor guards — so one leg of the suite still runs, and the other legs, the
  # oracle, the real runners and the plugin validator have nothing of theirs to judge.
  #
  # Skipped by step and not by job wherever a check is a matrix leg: branch protection requires
  # each leg by its full name, and every leg here still starts and reports under it. A job skipped
  # by its `if:` reports success, so `oracle`, `runners` and `plugin` skip whole. Every job that
  # reads this one runs unless the run was cancelled and treats any answer but `false` as a change
  # to code, so this job failing, or answering nothing, runs everything: it can only narrow a run
  # when it says, in so many words, that nothing outside `docs/` changed.
  #
  # A push (to `main`) runs everything. A pull request's checkout is the merge commit the platform
  # makes, so its first parent is the base the change is judged against, and `--no-renames` lists a
  # file moved into `docs/` under the name it left as well as the one it took. A name git quotes
  # does not begin `docs/` and counts as code. `smoke.yml` carries the same job, byte for byte.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Whether the change reaches outside docs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^docs/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # A public repository: anyone can open a pull request, so no job runs unbounded. Twenty
    # minutes, measured: the `prove` branch added about a thousand tests, many of them starting
    # processes, and `checks (macos-latest, 3.13)` was cancelled at fifteen right after its pytest
    # reported `7744 passed, 56 skipped in 876.84s` (738 s on the same leg before the branch;
    # macOS runners vary). The `oracle` job's comment below already prices a hung pytest at
    # twenty minutes, so this bound costs no more than that one does. That run still took the
    # hosted image's `go` and `node` into the real-runner tests, which only `runners` runs now;
    # the leg may fit fifteen again, but no run has measured it, so twenty stays until one does.
    timeout-minutes: 20
    # Every step carries `if: env.FULL == 'true'`: on a change to docs alone one leg runs whole and
    # the others start, skip every step and report (`changes` above says why).
    env:
      FULL: ${{ needs.changes.outputs.code != 'false' || matrix.os == 'ubuntu-latest' && matrix.python == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        # Linux across every supported interpreter, and macOS on one of them.
        #
        # The OS axis is not decoration. `fsops.open_within` branches on `ELOOP` (Linux) *or*
        # `ENOTDIR` (macOS) because O_NOFOLLOW reports a symlinked directory differently on the
        # two, and the `ENOTDIR` arm was reachable only on a developer's laptop — while the
        # absolute-path containment case is the one that completes on Linux specifically,
        # because `/etc` and `/var` are real directories there and symlinks on macOS. The users
        # of a Claude Code / Codex plugin are overwhelmingly on macOS, and macOS runners are
        # free on public repositories. One Python version there holds the job count at six.
        #
        # Nor is the interpreter axis. `pathlib`'s `is_file()`, `is_dir()`, `exists()` and
        # `is_symlink()` raise on a name longer than the system takes up to 3.13 and answer
        # `False` from 3.14, and a suite verified on 3.14 alone went red on every leg here. A
        # leg is added beside the others and none is renamed: branch protection requires each
        # existing check by its name.
        #
        # One leg pins a patch release, 3.11.4, because `3.11` resolves to the newest 3.11 and
        # the floor `requires-python` admits is 3.11.0. Python 3.11.0 to 3.11.4 misread a
        # possessive repeat of a group (fixed in 3.11.5), and Debian 12's own Python is 3.11.2:
        # there a path grammar, a symbol path, a frontmatter's flow mapping and a commit footer
        # each gave a verdict no later interpreter gives, and every leg here was green.
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.11.4"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.FULL == 'true'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: env.FULL == 'true'
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: An interpreter below the floor, for the launcher's version guard
        if: env.FULL == 'true'
        # `scripts/stayfixed` is the only thing between a Python 3.9 user and a SyntaxError, and
        # `test_an_old_interpreter_is_refused_with_a_reason` skipped for want of one on every
        # machine that has ever run it — so the guard was asserted nowhere, ever. The test is
        # handed this one by path rather than by searching, and fails rather than skips when it
        # is set, so a wrong path here is a red job and not a quiet skip.
        #
        # uv's build rather than `setup-python`'s: macOS runners carry no 3.10, and
        # `setup-python` spent 24 s of that job downloading one. `--no-bin` keeps the runner's
        # PATH as `setup-uv` left it; `--no-project` asks for 3.10 alone rather than against this
        # project's `requires-python`, which 3.10 is below by design. The lookup is assigned on a
        # line of its own because `bash -e` ignores a failed substitution inside `echo`'s
        # argument, and an empty path must fail this step rather than reach the test empty.
        id: old-python
        run: |
          uv python install --no-bin 3.10
          old="$(uv python find --no-project 3.10)"
          echo "python-path=$old" >> "$GITHUB_OUTPUT"
      - name: Install
        if: env.FULL == 'true'
        run: uv sync --locked
      - name: Lint and format
        if: env.FULL == 'true'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        if: env.FULL == 'true'
        run: uv run mypy
      - name: Tests
        if: env.FULL == 'true'
        # Coverage, because security-sensitive code with nobody able to say which containment
        # branches are exercised is how an untested `..` argument stayed invisible: the walk's
        # loop was covered, just never with an escaping path. No statement count is written here:
        # every change falsifies one, and the report prints it.
        env:
          STAYFIXED_OLD_PYTHON: ${{ steps.old-python.outputs.python-path }}
        run: uv run pytest -n auto --cov --cov-report=term-missing --cov-fail-under=92
      - name: Version discipline
        if: env.FULL == 'true'
        run: uv run python scripts/release.py check
      - name: Build
        if: env.FULL == 'true'
        run: uv build
      - name: The artifacts carry what an installed stayfixed needs
        if: env.FULL == 'true'
        # Every earlier test resolves the template tree to the checkout; only an artifact
        # can say whether the build backend shipped it.
        run: uv run python scripts/check_artifacts.py dist
      - name: An installed wheel renders the overlay template
        if: env.FULL == 'true'
        # The wheel is installed into a scratch environment with no checkout in reach, and
        # `setup --overlay <path>` — the one entry for a first overlay — has to find its template
        # tree inside the package. Under a `HOME` of its own, so the machine file and the
        # settings it writes are the scratch's, and with the system's `PATH`, where `git` is and
        # no harness CLI or `pre-commit` is, so its secret scan is a note; it names no plugin, so
        # it installs none.
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin "$RUNNER_TEMP/wheel/bin/stayfixed" setup \
            --overlay "$RUNNER_TEMP/rendered"
          uv run python scripts/check_artifacts.py rendered "$RUNNER_TEMP/rendered"

  # The mutation oracle, in a job of its own and on one configuration.
  #
  # The plans ask that "every new assertion ships with the mutation that reddens it", and those
  # mutations existed only as English sentences inside multi-thousand-line plan documents: a
  # contributor could satisfy the rule only by hand-editing source and reverting, and a reviewer
  # had no way to check they had. `mutations/` is that set as data, and this job is the
  # check. Not a general mutation tester — coverage is the breadth measure; this proves a
  # curated set of guards is load-bearing rather than merely executed, which is the distinction
  # that let `open_within` be fully covered and contain nothing.
  #
  # **Why it is not a step of `checks` any more.** Measured on the last green run, it was 76% of
  # that job: 657 s of an 869 s job on macOS, 751 s of 879 s on Linux, against a 900 s bound. So
  # every configuration sat inside a minute of the cliff, and the branch that took
  # `mutations/` from 372 to 382 entries — about +20 s on a 751 s step — pushed
  # `checks (macos-latest, 3.13)` over it at 15m18s. Running it on one configuration instead of
  # four is right and is not sufficient on its own: `timeout-minutes` is a PER-JOB bound, so
  # paying once rather than four times returns 657-751 s to the three configurations that stop
  # running it and nothing at all to the one that still does. That job stayed at ~903 s of 900 s.
  # A job of its own is the only shape where the arithmetic closes, and it also returns the
  # `checks` legs in ~130-210 s instead of ~900 s, with the oracle running beside them rather
  # than inside them.
  #
  # **Why one configuration is enough**, which is the half that had to be checked rather than
  # assumed. The oracle proves "this mutation reddens this test" — a property of the code and of the
  # tests, not of the platform. The matrix comment above argues the OS axis is load-bearing and it
  # is right, but that argument is about the *tests*: `fsops.open_within` branches on `ELOOP`
  # (Linux) against `ENOTDIR` (macOS). Every `reddens` target was resolved to its function and read
  # for skip gates when this was written. The gates ask for a program or a file the machine may
  # lack — `git`; this repository's `.git` and workflow files — for a user other than root, for an
  # interpreter that has `os.waitid` or is 3.14, and for a filesystem that can hold a name that is
  # not UTF-8. Some of those are platform-dependent, so it is this job's to satisfy them: every one
  # is satisfied here but the 3.14 gate, which skips two parametrized cases that no entry names. No test under `tests/`, and nothing in `src/` or `scripts/`, branches on `sys.platform`
  # or `platform.system()`. The errno divergence is absorbed inside one branch rather than by
  # skipping a test, and no entry targets that line.
  #
  # And if a platform gate is ever added to a `reddens` target, this goes red rather than quiet:
  # `_check` runs the clean tree first and demands `Outcome.passed`, which is
  # `code == 0 and executed > 0`, where `executed` subtracts skips and errors. A `reddens` set
  # that does not run here is a finding on the clean run, before the mutation is applied. It is
  # never banked as a proof, which is the failure that would matter.
  oracle:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Derived, not rounded. The oracle proves entries in one scratch checkout per CPU the
    # runner gives it — four on `ubuntu-latest` — against a bytecode cache warmed once from HEAD.
    # Measured in this job on 2026-10-14 (run 38503891987): 2,606 entries in 1,186 s, 0.455 s an
    # entry, and the job was cancelled at its 20-minute bound a second after the oracle printed
    # that every mutation was caught, as it had been on 2026-10-08 (1,869 entries in 719 s,
    # 0.385 s, against the 12-minute bound it then had). The rate had been 0.31 s at 566 entries:
    # it climbs as the entries' tests do more, so it is re-measured from this job's runs, not
    # assumed. The rest of the job came to ~8 s; the budget test keeps its 60 s allowance for
    # setup and 60 s for runner variance anyway.
    #
    # 30 minutes is 1,800 s: less both allowances that leaves 1,680 s, which at this rate holds
    # roughly **3,700 entries** in all; at twice the rate — a runner with half the CPUs — about
    # 1,850, fewer than the set holds now, so the bound assumes the four-CPU runner. No count of
    # today's entries is written here, because every change that adds one would falsify it: the
    # budget test counts `mutations/` itself, projects exactly this sum (entries x rate + 60 s +
    # 60 s) and reddens when it passes 1,200 s. Kept well above the measurement rather than at it,
    # because a bound this job hits is a cancelled check, not a finding; and still bounded, because
    # a hung pytest should cost twenty minutes, not GitHub's six hours. Not sharded: a matrix would
    # rename the `oracle` check the branch protection requires, and multiply the setup cost; the
    # parallelism lives inside the job instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: The mutation oracle
        run: uv run python scripts/mutation_oracle.py

  # The plugin as the directory reads it. The directory reads the plugin repository's commit, and
  # that commit's root is the tree `scripts/plugin_tree.py render` writes from this one — not this
  # checkout, whose root also holds the tests, the plans and the tooling. So the two manifests are
  # validated where the render put them, as the plugin repository will hold them.
  plugin:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # For the render: `plugin_tree.py` runs on the project's interpreter, as every script does.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Claude Code for the plugin validator
        run: npm install -g @anthropic-ai/claude-code@2.1.261
      - name: Install
        run: uv sync --locked
      - name: The plugin tree, rendered from this commit
        # Read from the commit and not from the disk, as the release reads it.
        run: uv run python scripts/plugin_tree.py render --root . --rev HEAD --out "$RUNNER_TEMP/plugin"
      - name: Validate the rendered manifests and this repository's catalog
        # The catalog stays here and names the plugin repository by a `url` source; validation
        # reads it without fetching that source, so it is validated where it is.
        run: |
          claude plugin validate "$RUNNER_TEMP/plugin/.claude-plugin/plugin.json" --strict
          claude plugin validate "$RUNNER_TEMP/plugin/.codex-plugin/plugin.json"
          claude plugin validate .claude-plugin/marketplace.json --strict
      - name: A catalog whose entry pins a commit by sha validates
        # A release commit's entry pins the plugin repository's commit by `sha` beside its `ref`,
        # and the catalog on `dev` may pin none, so the shape a release ships is validated on every
        # change: a scratch copy of the catalog whose entry carries a `sha`.
        run: |
          mkdir -p "$RUNNER_TEMP/pinned/.claude-plugin"
          python3 - .claude-plugin/marketplace.json "$RUNNER_TEMP/pinned/.claude-plugin/marketplace.json" <<'PY'
          import json, sys
          catalog = json.load(open(sys.argv[1], encoding="utf-8"))
          [entry] = catalog["plugins"]
          entry["source"]["sha"] = "0" * 40
          with open(sys.argv[2], "w", encoding="utf-8") as out:
              json.dump(catalog, out, indent=2)
          PY
          claude plugin validate "$RUNNER_TEMP/pinned/.claude-plugin/marketplace.json" --strict
      - name: The platform's own tag tool agrees with the manifests
        # `claude plugin tag --dry-run` compares `plugin.json`'s version with each marketplace
        # entry that carries a version of its own, and this repository's entry carries none: its
        # `ref` names the release instead, and the `checks` job's version discipline holds that
        # `ref` equal to the other sources. So this is the tool `RELEASING.md` runs at the tag,
        # run on every change beside a `url` entry. A dry run creates nothing.
        run: claude plugin tag --dry-run .

  # The real test runners `prove`'s adapters run, at the versions the adapters were measured
  # against: Node 26.12.0, jest 30.5.2 and vitest 5.0.5 (`tests/fixtures/prove/node/`'s lockfile)
  # and Go 1.27.2. Only this job opts the tests into them: `STAYFIXED_RUNNERS_ON_PATH=1` takes
  # `node` and `go` from `PATH` and `STAYFIXED_NODE_MODULES` names the installed packages. Every
  # other job sets neither, so the hosted image's own `node` and `go` are never used and the tests
  # that need one skip (`tests/prove/real_runners.py`); the real pytest runs there, from the
  # suite's own environment. The mutation oracle never depends on a runner: every mutation is
  # reddened by a test that runs none. Here `STAYFIXED_REQUIRE_RUNNERS=1` turns a missing runner
  # into a failure, so this job cannot pass by skipping what it exists to run.
  #
  # Go comes from the Go module proxy as the toolchain module the `go` command itself switches to,
  # checked against the SHA-256 of the zip recorded when the version was pinned, rather than from
  # an action: the zip carries its files' modes, and the digest is the pin. jest and vitest come
  # from the fixture's lockfile with `npm ci`, no package's install script run, into the runner's
  # scratch directory and never into the checkout, which the tree's own walks read.
  runners:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.0"
      - name: Go 1.27.2, the toolchain module, checked against its digest
        env:
          GO_TOOLCHAIN: golang.org/toolchain@v0.0.1-go1.27.2.linux-amd64
          GO_ZIP_SHA256: 3a467ed067f27cd55bf3a702f8e2bf12479f53c9d8ae0de548f48ebcb3c67796
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/go.zip" "https://proxy.golang.org/golang.org/toolchain/@v/v0.0.1-go1.27.2.linux-amd64.zip"
          echo "$GO_ZIP_SHA256  $RUNNER_TEMP/go.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/go.zip" -d "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/$GO_TOOLCHAIN/bin" >> "$GITHUB_PATH"
      - name: Install
        run: uv sync --locked
      - name: jest and vitest, from the fixture's lockfile
        run: |
          mkdir -p "$RUNNER_TEMP/node"
          cp tests/fixtures/prove/node/package.json tests/fixtures/prove/node/package-lock.json "$RUNNER_TEMP/node/"
          npm ci --prefix "$RUNNER_TEMP/node" --ignore-scripts --no-audit --no-fund
      - name: The tests that run a real runner
        env:
          STAYFIXED_REQUIRE_RUNNERS: "1"
          STAYFIXED_RUNNERS_ON_PATH: "1"
          STAYFIXED_NODE_MODULES: ${{ runner.temp }}/node/node_modules
        run: |
          node --version
          go version
          uv run pytest -n auto -m runners
