# The `owner/repo/…@ref` call forms — what a project actually writes, and what the same-repo
# form cannot test, because it carries no ref and would hide a dangling tag. Dispatched by
# hand, at every release (RELEASING.md): a reusable-workflow ref is resolved when the run is
# created and `uses:` takes no expression, so `@dev` resolves only once this work has merged,
# and the release tag only once the release that carries this file has been tagged. That tag is
# written here by hand in the release commit, and `tests/test_fixtures.py` holds it to the
# version the tree carries. Both callers are stayfixed calling stayfixed, so what is exercised is
# ref resolution, for a branch and for a tag, and the `job.workflow_sha` checkout assertion
# inside check.yml — not a second repository or a token that cannot reach one. Neither is the
# form the reference recommends, a full-length sha: `@dev` moves on purpose and against
# principle 9, and a tag stays put only because this repository's tag ruleset holds it. They
# are run here so that they are known to work, and nothing a consumer copies from this file is
# a form the reference tells them to write. The `v1` alias a 1.x release moves is a tag too, and
# resolves as this one does; which commit it names is what RELEASING.md's alias step checks.
name: smoke-release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  at-the-development-branch:
    uses: stayfixed/stayfixed/.github/workflows/check.yml@dev
    with:
      path: tests/fixtures/smoke-project
      base: main
  at-the-release:
    uses: stayfixed/stayfixed/.github/workflows/check.yml@v0.3.0
    with:
      path: tests/fixtures/smoke-project
      base: main
