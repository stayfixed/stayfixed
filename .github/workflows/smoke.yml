# The install smoke: the plugin repository's commit built from this commit as the release builds it,
# tagged in a scratch repository, and installed from there through a `url` source pinned by `ref`
# and `sha` with the real harness CLI under a temporary configuration directory; the installed
# tree held to a render of this commit, every hook entry fed a sample event through the
# INSTALLED wrapper, the reusable workflow called in the same-repository form — the two
# `owner/repo/…@ref` forms are `smoke-release.yml`'s, for the reason `same-repository-form`
# below states — and the clone-to-exfiltration scenario. Weekly as well as on every
# change, because the harness CLI
# moves under this repository and only a run can say whether an install still works.
#
# Every value that reaches a shell arrives through `env:`, including the installed plugin's
# own path: `steps.install.outputs.root` is built by `find` and is this job's own, but a
# `${{ }}` in a `run:` is interpolated before the shell parses the script, and the rule is
# about the shape rather than about which values happen to be safe today.
name: smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change reaches: `ci.yml`'s job of the same name, byte for byte, which says why. Neither
  # leg below has anything of its own to judge in a change to `docs/` alone, which ships in no
  # plugin tree, so on one both legs start, skip every step and report.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Whether the change reaches outside docs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -qv '^docs/'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  installed-plugin:
    needs: changes
    # A fork inherits the schedule; only this repository runs it weekly.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'stayfixed/stayfixed') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    # Every step carries `if: env.FULL == 'true'`, and any answer from `changes` but `false` runs it.
    env:
      FULL: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.FULL == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.FULL == 'true'
        with:
          node-version: "22"
      - name: The interpreter every step below runs on
        if: env.FULL == 'true'
        # stayfixed's floor is 3.11 and `check.yml` pins with this action for the same reason:
        # the two smoke scripts and `python3 -m stayfixed doctor` all run the runner's bare
        # `python3`, and which interpreter that is on `macos-latest` is the image's business
        # rather than a contract. One step removes the question from every step after it.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # For the render: `plugin_tree.py` runs on the project's interpreter, as every script does.
      # The steps that run the installed plugin keep the bare `python3` above.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: env.FULL == 'true'
        with:
          enable-cache: true
          python-version: "3.13"
      - name: The harness CLI, at the version ci.yml validates with
        if: env.FULL == 'true'
        # One version in two files; RELEASING.md names both. Not Dependabot's: a global npm
        # install is not a manifest. The laptop measurement below was taken against 2.1.263;
        # this pin is the one ci.yml already validates with, and the first run of this job
        # is the measurement for it.
        run: npm install -g @anthropic-ai/claude-code@2.1.261
      - name: The plugin repository, its commit built from this one as the release builds it
        if: env.FULL == 'true'
        id: plugin-repo
        # The directory and every user read the plugin repository's commit, the one the
        # marketplace entry pins by `sha`, and `scripts/plugin_tree.py commit` builds it from this
        # commit as the release computes it, into a scratch repository whose `main` names it and
        # whose `v<version>` names a decoy past it, the version read from the commit's own
        # `plugin.json`.
        # `--no-parent`: the scratch repository holds no earlier plugin commit, and a commit naming
        # a parent it lacks would break the clone once the first parent pins a `sha`. The render
        # beside it is what the installed tree is held to, file for file, below. The tag is moved
        # to a decoy one commit past the built one, holding one file more, so the entry's `ref`
        # names the decoy and only its `sha` the built commit: a harness that installed by the
        # `ref` and not the `sha` installs a tree that comparison refuses.
        run: |
          uv sync --locked
          uv run python scripts/plugin_tree.py render --root . --rev HEAD \
            --out "$RUNNER_TEMP/plugin-repo" --manifest-file "$RUNNER_TEMP/plugin-tree.txt"
          # `--json` writes a refusal's sentence into the file too, so a failure prints the file.
          uv run python scripts/plugin_tree.py commit --root . --rev HEAD \
            --git-dir "$RUNNER_TEMP/plugin-repo.git" --no-parent --json > "$RUNNER_TEMP/plugin-commit.json" \
            || { cat "$RUNNER_TEMP/plugin-commit.json" >&2; exit 1; }
          version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/plugin-commit.json")"
          commit="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["commit"])' "$RUNNER_TEMP/plugin-commit.json")"
          test -n "$version"
          # The script prints no other shape, so no test reaches this; `tests/test_check_workflow.py`
          # holds its pattern to the scripts'.
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::plugin_tree.py commit named no plugin commit: '$commit'"
            exit 1
          fi
          git --git-dir="$RUNNER_TEMP/plugin-repo.git" update-ref refs/heads/main "$commit"
          blob="$(printf 'not the pinned commit\n' | git --git-dir="$RUNNER_TEMP/plugin-repo.git" hash-object -w --stdin)"
          tree="$({ git --git-dir="$RUNNER_TEMP/plugin-repo.git" ls-tree "$commit"; printf '100644 blob %s\tdecoy\n' "$blob"; } | git --git-dir="$RUNNER_TEMP/plugin-repo.git" mktree)"
          decoy="$(git --git-dir="$RUNNER_TEMP/plugin-repo.git" -c user.name=smoke -c user.email=smoke@example.invalid commit-tree "$tree" -p "$commit" -m "a decoy past the pinned commit")"
          git --git-dir="$RUNNER_TEMP/plugin-repo.git" update-ref "refs/tags/v$version" "$decoy"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Install the plugin from that repository into a temporary configuration directory
        if: env.FULL == 'true'
        id: install
        # Production's source type over another transport, with no network: the marketplace is
        # this repository's catalog with its one entry's `url` pointed at the repository above by
        # `file://`, its `ref` at that tag and its `sha` at that commit, so the harness clones the
        # pinned commit as a user's does. Measured 2026-09-19 on a laptop against 2.1.263 for the
        # path source this replaced: both commands exit 0 with no authentication and no network,
        # and the installed wrapper carries its executable bit, which the wrapper needs to run at
        # all. The `url` source over `file://` was measured by this job itself, on both legs, at
        # 956d2d0.
        env:
          VERSION: ${{ steps.plugin-repo.outputs.version }}
          COMMIT: ${{ steps.plugin-repo.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/market/.claude-plugin"
          python3 - .claude-plugin/marketplace.json "$RUNNER_TEMP/market/.claude-plugin/marketplace.json" "file://$RUNNER_TEMP/plugin-repo.git" "v$VERSION" "$COMMIT" <<'PY'
          import json, sys
          catalog = json.load(open(sys.argv[1], encoding="utf-8"))
          [entry] = catalog["plugins"]
          assert catalog["name"] == "stayfixed-marketplace", catalog["name"]
          assert entry["name"] == "stayfixed" and entry["source"]["source"] == "url", entry
          entry["source"] = {"source": "url", "url": sys.argv[3], "ref": sys.argv[4], "sha": sys.argv[5]}
          with open(sys.argv[2], "w", encoding="utf-8") as out:
              json.dump(catalog, out, indent=2)
          PY
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          claude plugin marketplace add "$RUNNER_TEMP/market"
          claude plugin install stayfixed@stayfixed-marketplace
          cache="$CLAUDE_CONFIG_DIR/plugins/cache/stayfixed-marketplace/stayfixed"
          root="$(find "$cache" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$root"
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: The installed copy is the shipped one, and the wrapper can run
        if: env.FULL == 'true'
        env:
          INSTALLED: ${{ steps.install.outputs.root }}
        run: |
          diff -r hooks "$INSTALLED/hooks"
          diff scripts/stayfixed "$INSTALLED/scripts/stayfixed"
          test -x "$INSTALLED/hooks/run-hook.sh"
      - name: The installed tree is the rendered one, file for file
        if: env.FULL == 'true'
        # The harness copies what the source names into its cache, and only a comparison says it
        # copied all of it and added nothing: the hooks, `doctor` and the scenario below read part
        # of the tree, and the skills, the agents, `README.md` and `LICENSE` have no reader in this
        # job. `.git` is a clone's own, not a file of the plugin's. `.in_use` is the harness's:
        # claude 2.1.261 writes it into the installed root on both runner OSes, measured on this
        # job's first run over the rendered tree, 2026-10-10, where it was the only difference.
        # Each exclusion is a name, never a pattern.
        env:
          INSTALLED: ${{ steps.install.outputs.root }}
        run: diff -r -x .git -x .in_use "$RUNNER_TEMP/plugin-repo" "$INSTALLED"
      - name: Every hook entry, fed its sample event through the installed wrapper
        if: env.FULL == 'true'
        env:
          INSTALLED: ${{ steps.install.outputs.root }}
        run: |
          # `pipefail` because the default shell here is `bash -e` and not `bash -eo pipefail`:
          # without it `tee` decides the step's exit status and a failing script reads green.
          set -o pipefail
          python3 scripts/smoke_hooks.py --plugin-root "$INSTALLED" \
            --fixture tests/fixtures/smoke-project --scratch "$RUNNER_TEMP/smoke" \
            | tee "$RUNNER_TEMP/hooks.out"
          # The script carries the same floor in its own constants; this is the CI side of it,
          # because a run that executed one row exits 0 and prints a summary that reads green.
          # `tests/test_check_workflow.py` derives this line from those constants.
          grep -qx "10 entries, 11 row(s), 0 failure(s)" "$RUNNER_TEMP/hooks.out"
      - name: doctor on the installed plugin reports no red row
        if: env.FULL == 'true'
        env:
          CLAUDE_PLUGIN_ROOT: ${{ steps.install.outputs.root }}
          CLAUDE_PLUGIN_DATA: ${{ runner.temp }}/smoke/data
          # The installed package: `doctor` judges the tree it was imported from, so importing
          # this checkout's `src` reported on the repository, and a runtime path the render
          # omitted would have passed.
          PYTHONPATH: ${{ steps.install.outputs.root }}/src
        run: |
          python3 -m stayfixed doctor --json --root "$RUNNER_TEMP/smoke/project" \
            --home "$RUNNER_TEMP/smoke/home" --machine "$RUNNER_TEMP/machine.toml" \
            > "$RUNNER_TEMP/doctor.json" || true
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          rows = report["checks"]
          red = [row for row in rows if row["status"] == "red"]
          for row in rows:
              print(f"{row['status']:<5} {row['name']:<16} {row['detail'][:100]}")
          # `assert not red` passes on zero rows, and a doctor that reported none — a JSON
          # shape change, a report truncated by an error this step swallows with `|| true` —
          # would read as the cleanest run there is. `run_checks` promises nineteen rows,
          # always nineteen, so the count is the claim; the five named are the ones this job
          # exists to watch, and a report missing one of them is not a green report.
          assert len(rows) == 19, len(rows)
          named = {row["name"] for row in rows}
          wanted = {"files", "wrapper", "hook-entries", "attached", "ignored-env"}
          assert wanted <= named, wanted - named
          assert not red, red
          PY
      - name: The clone-to-exfiltration scenario
        if: env.FULL == 'true'
        env:
          INSTALLED: ${{ steps.install.outputs.root }}
        run: |
          set -o pipefail
          python3 scripts/smoke_exfiltration.py --plugin-root "$INSTALLED" \
            --fixture tests/fixtures/hostile-project --scratch "$RUNNER_TEMP/hostile" \
            | tee "$RUNNER_TEMP/hostile.out"
          # Seven of this scenario's nine rows assert an ABSENCE, which is also what a run of
          # one row prints. The count is the difference between those two runs, and
          # `tests/test_check_workflow.py` derives it from the script's own constant.
          grep -qx "9 row(s), 0 failure(s)" "$RUNNER_TEMP/hostile.out"

  same-repository-form:
    # The same guard `installed-plugin` carries: a fork inherits the schedule, and only this
    # repository runs either job weekly.
    if: github.event_name != 'schedule' || github.repository == 'stayfixed/stayfixed'
    # The `./` call form. What this exercises against the FIXTURE is `stayfixed gate`'s
    # configuration check — the fixture's `stayfixed.toml` judged against the base branch's copy —
    # and the `docs` and `bugs` gates; `commit`, `plan` and `trail` read git, and the fixture is a
    # directory inside stayfixed's own repository here, so those three answer for stayfixed's
    # commits and plans — which is a real check of the workflow's plumbing and not a check of the
    # fixture. The fixture-as-repository run is `installed-plugin`'s `doctor` step and
    # `tests/test_fixtures.py`. The `owner/repo@ref` forms live in smoke-release.yml: a
    # reusable-workflow ref is resolved when the run is created, `uses:` takes no expression, and
    # neither `@dev` nor a release tag names the commit a pull request is testing.
    #
    # `timeout-minutes` is passed, and not left to the default: every other call passes none,
    # and only a run proves that the platform takes a value a caller passed, through the
    # expression, as the job's bound.
    uses: ./.github/workflows/check.yml
    with:
      path: tests/fixtures/smoke-project
      base: ${{ github.base_ref || 'main' }}
      timeout-minutes: 25
