version: 2
updates:
  # Every action in `.github/workflows/` is SHA-pinned with a version comment, which is right
  # and is also why they rot silently: nothing tells you a pin is two years old. Dependabot
  # rewrites the SHA *and* the comment. `directory: /` is the whole of that tree and not one
  # file, so a workflow added tomorrow is covered without editing this — which is why this
  # comment names the directory rather than counting the actions, the way it used to.
  # What it does NOT cover is `src/stayfixed/templates/overlay/.github/workflows/`: the
  # overlay template's own pins are not in a workflow directory the platform reads, and
  # `RELEASING.md` section 4 is where they are checked by hand.
  - package-ecosystem: github-actions
    directory: /
    # Every change reaches `main` through `dev`, so updates are proposed where changes land;
    # the default, the repository's default branch, would skip `dev` and the release merge.
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Development dependencies only — stayfixed has no runtime dependencies, and
  # `tests/boundaries/test_layering.py` is what keeps it that way.
  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev:
        patterns: ["*"]
