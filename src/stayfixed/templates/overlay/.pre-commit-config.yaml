# The first of two secret scans. A private repository on a personal plan is not scanned for
# you, so this hook is what stands between a pasted token and a commit. The revision is pinned
# on purpose: an unpinned one lets somebody else choose what runs on your machine. It is a full
# commit sha, because a tag is a name its owner can move; the comment is the release it is, and
# `GITLEAKS_VERSION` in `.github/workflows/scan.yml` names the same release.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
