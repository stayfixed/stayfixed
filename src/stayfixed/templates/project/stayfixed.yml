# Written by `stayfixed init`. The ref below is `[ci] ref` from stayfixed.toml — a full-length
# sha, the only immutable reference for a reusable workflow. Keep the two equal: `stayfixed
# doctor` reports red when the workflow pins something else, because then the gate that runs is
# not the one recorded. Do not replace it with a branch name; `stayfixed upgrade` moves both
# together.
#
# The gate branch is named four times below, and each one is load-bearing. A pull request into any
# other branch runs nothing here, and neither does another branch's merge queue, which would be
# judged against this branch's configuration; `edited` re-runs the check when a pull request is
# retargeted onto this branch, title edits included, because filtering those out with `if:` would
# report a skipped check, which a required check counts as passing; one retargeted away keeps this
# branch's check, so require the check on this branch alone; and `base:` is a literal, so the
# reusable workflow refuses a pull request whose base is not this branch even if the trigger is
# widened by hand. `merge_group` makes the check report for the gate branch's merge queue. None of
# it holds unless `/.github/` needs a code owner's review: `docs/cli.md#the-reusable-workflow`
# names the settings.
name: stayfixed

on:
  pull_request:
    branches: ["%%GATE_BRANCH%%"]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: ["%%GATE_BRANCH%%"]
  push:
    branches: ["%%GATE_BRANCH%%"]

permissions:
  contents: read

jobs:
  check:
    uses: %%SLUG%%/.github/workflows/check.yml@%%REF%%
    with:
      base: "%%GATE_BRANCH%%"
