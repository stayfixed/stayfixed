# which is what makes `--dry-run` honest rather than a second code path that happens to agree.
[[mutation]]
name = "init applies the write-once pass before it has looked at either plan's refusals"
file = "src/stayfixed/project/init.py"
before = "    if dry_run or report.refused:"
after = "    if False:"
