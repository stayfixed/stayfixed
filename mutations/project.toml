# Three claims were held true by reading, and one had already drifted back: the template README said
# "fifteen files" while a rendered overlay has sixteen — the scaffold engine writes
# `.stayfixed/manifest.json`, which is in neither of that README's tables and is the file `overlay
# upgrade` keys on. The denominator is `OVERLAY_FILES` plus that path, so a change that adds a
# template file now reddens the document instead of outliving it. The template ships fourteen
# files today and a create leaves fifteen, and the count below moved with each change to them. This
# entry is an inline count too, so it has to move as well; the unfiltered oracle is what says so,
# because a run filtered to one change's own entries cannot see an entry declared earlier that the
# change invalidated.
[[mutation]]
name = "the overlay README stops counting the manifest"
file = "src/stayfixed/templates/overlay/README.md"
before = "`stayfixed overlay create` renders fifteen files here:"
after = "`stayfixed overlay create` renders sixteen files here:"
reddens = [
  "tests/overlay/test_template.py::test_the_overlay_readme_counts_the_files_a_create_actually_leaves",
]

# The other half of that document: the right count over the wrong files. `hooks/hooks.json`
