# The project group: a repository's footprint and the templates, profiles and presets behind it.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# The one invariant here whose failure ships a permission to every machine that ever creates an
# overlay from the template. The plugin author may never grant one; only the machine owner may, on
# their own instance.
[[mutation]]
name = "the overlay template starts granting a permission"
file = "src/stayfixed/templates/overlay/common/claude/permissions.json"
before = '  "permissions": {}'
after = '  "permissions": {"allow": ["Bash(:*)"]}'
reddens = [
  "tests/overlay/test_template.py::test_the_template_ships_no_allow_rule_anywhere",
  "tests/overlay/test_template.py::test_the_template_ships_permissions_that_are_neither_granted_nor_pretended",
]

# In the block led by `mutations/`'s "overlay init leaves the template's owner and author
# placeholders": the overlay's marketplace validates only with an owner in it.
[[mutation]]
name = "the overlay template ships a marketplace with no owner"
file = "src/stayfixed/templates/overlay/.claude-plugin/marketplace.json"
before = """  "owner": {
    "name": "your-account"
  },
"""
after = ""
reddens = [
  "tests/overlay/test_template.py::test_the_overlay_ships_a_marketplace_and_manifests_the_harness_validates",
]

# --- the shipped data files: guards the external review proved shipped green (PR 12) ---
#
# Each mutates a file no type checker reads and no import reaches: a YAML workflow, a
# permissions table, a `.gitignore`. That is exactly why they are here. `hooks/run-hook.sh` has
# entries on the same argument -- CONTRIBUTING's rule is that a genuinely load-bearing guard goes
# into `mutations/` rather than only being described, and a `# Mutation: ...` comment in a test
# body is a description.

# The overlay's first secret scan, and the revision decides whose code runs on the owner's
# machine at every commit. The assertion this entry belongs to used to be `"rev:" in config`,
# which is true of every possible pre-commit configuration including this mutation's result --
# it is one of the six data-file guards the external review proved shipped green.
[[mutation]]
name = "the overlay template follows gitleaks' default branch"
file = "src/stayfixed/templates/overlay/.pre-commit-config.yaml"
before = "    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1"
after = "    rev: main"
reddens = [
  "tests/overlay/test_template.py::test_the_template_pins_gitleaks_at_a_revision",
]

# The `.env` deny rules, where they actually fire. The overlay template used to carry a second,
# smaller copy of them, asserted by value over there -- dead, because `attach.permissions` reads
# `permissions.allow` and never `permissions.deny`, and already one rule behind this list. That
# copy is gone; this is the proof that the live one is asserted by value and not by substring,
# which `["Read(.env)"]` would satisfy while leaving `.env.prod` readable.
[[mutation]]
name = "the preset stops denying the env files"
file = "src/stayfixed/presets/recommended.toml"
before = '  "Read(**/.env.prod)",'
after = '  "Read(**/.env.prd)",'
reddens = ["tests/setup/test_machine.py::test_the_preset_denies_reading_env_files_by_value"]

# And by name, never by a mask: a deny rule outranks every allow rule, so a mask that reaches
# `.env.example` refuses the template for good.
[[mutation]]
name = "the preset denies the env files by a mask again"
file = "src/stayfixed/presets/recommended.toml"
before = '  "Read(**/.env.test)",'
after = '  "Read(**/.env.*)",'
reddens = ["tests/setup/test_machine.py::test_no_preset_deny_rule_reaches_a_template"]

# The cheap half of the promise that the overlay never holds a credential. The assertion was `".env"
# in text`, and the word appears in the file's own explanatory comment -- so commenting out every
# pattern left it green with nothing ignored at all. This is that mutation.
[[mutation]]
name = "the overlay template stops ignoring env files"
file = "src/stayfixed/templates/overlay/.gitignore"
before = '''
.env
.env.*
'''
after = '''
# .env
# .env.*
'''
reddens = [
  "tests/overlay/test_template.py::test_the_template_ignores_env_files",
]

# `pull_request_target` runs with the base repository's secrets against a *fork's* head, which is
# the standard Actions privilege-escalation shape. Nothing in the suite read this file at all
# before the repair: the reviewer rewrote the trigger and the scopes together and all 43 cases
# passed, in a workflow that ships into every overlay a user creates.
[[mutation]]
name = "the overlay's secret scan runs a fork's head"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = "  pull_request:"
after = "  pull_request_target:"
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_never_runs_a_forks_head_with_the_repositorys_own_token",
]

# The other half of `mutations/`'s "the overlay's secret scan runs a fork's head", and the half that
# makes that one dangerous. A secret scan needs read scopes only (`contents`, and `pull-requests`
# for the action's reads of the pull request); a write scope on the token this workflow hands a
# third-party action is a repository that can be pushed to by whatever that action does.
[[mutation]]
name = "the overlay's secret scan is given a write token"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = '''permissions:
  contents: read'''
after = '''permissions:
  contents: write
  id-token: write'''
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_never_runs_a_forks_head_with_the_repositorys_own_token",
]

# The permission the action's pull-request scan cannot run without. On `pull_request` it lists the
# pull request's commits through `GET /repos/{owner}/{repo}/pulls/{n}/commits`, and a private
# repository -- an overlay is one by design -- answers that to a token holding `pull-requests: read`
# only. A `permissions:` block that names `contents` alone sets every other scope to none.
[[mutation]]
name = "the overlay's secret scan cannot list a pull request's commits"
file = "src/stayfixed/templates/overlay/.github/workflows/scan.yml"
before = """permissions:
  contents: read
  pull-requests: read"""
after = """permissions:
  contents: read"""
reddens = [
  "tests/overlay/test_template.py::test_the_scan_workflow_can_read_a_pull_requests_commits_in_a_private_repository",
]

# The same argument `mutations/`'s "the overlay template follows gitleaks' default branch" makes
