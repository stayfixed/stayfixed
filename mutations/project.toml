before = "    if (root / MANIFEST_PATH).is_file():"
after = "    if False:"
reddens = [
  "tests/project/test_init.py::test_an_initialised_repository_is_refused_and_offered_upgrade",
]

# One invariant, enforced from both ends: the workflow's `uses:` ref is what `[ci] ref` says on
# disk after the run, and `doctor`'s `ci-ref` row reports red when the two disagree. On the
# adoption path `stayfixed.toml` is a create-once artifact already on disk, so a pin recorded
# into the in-memory tables reaches no file — and the workflow written beside it then pins a sha
# the document does not carry. Measured before this guard: an adopted `ref = "aaa…"`, a listing
# resolving `bbb…`, the workflow pinning `bbb…`, `stayfixed.toml` still saying `aaa…`, `skipped`
# empty, and the run printing `CI: v0.1.0@bbb…` as a success.
[[mutation]]
name = "init records a resolved pin in a document it did not create, so the workflow outruns [ci] ref"
file = "src/stayfixed/project/init.py"
before = "    if resolution.pin is not None and existing is None:"
after = "    if resolution.pin is not None:"
reddens = [
  "tests/project/test_init.py::test_an_adopted_ref_is_what_the_workflow_pins_and_the_document_is_not_rewritten",
  "tests/project/test_init.py::test_an_adopted_document_with_no_ref_gets_no_workflow_at_all",
  "tests/project/test_command.py::test_an_adopted_ref_is_reported_as_the_repositorys_own_and_not_as_a_release",
]

