# Which sentence the run gives for a missing `[ci] ref`, and this entry used to claim something
# else. It was named "a ci-workflow artifact is rendered with no released commit to pin it to",
# and the mutation cannot render one: what renders a workflow is a `[ci] ref` that is non-empty
# and matches `CI_REF` — two guards with entries of their own — and this arm is reached only
# when there is no ref at all, so the `NO_TAG` case merely falls through to `NO_REF` and no
# workflow is offered either way. The test's own comment says so.
#
# What it does break is the reason, and that is worth an entry on this branch's own argument.
# Three states reach here with no ref, and they have three different remedies: the document this
# repository already had records none (`NO_REF`, and nothing the network says can change it), the
# remote could not be asked (`NOT_ASKED`, try again before a run writes), no released tag matches the version running
# (`NO_TAG`, wait for a release). Collapsing them is how the adoption path came to be sent to the
# network for a file it has to edit by hand — the defect `adopted` was threaded to fix, one commit
# below this one. The mutation makes the run that resolved nothing report the adopted document's
# sentence instead of its own.
[[mutation]]
name = "the no-released-tag state is reported as the adopted document's own reason"
file = "src/stayfixed/project/templates.py"
before = "    if resolution.pin is None:"
after = "    if False:"
reddens = [
  "tests/project/test_templates.py::test_the_ci_workflow_is_offered_only_with_a_recorded_ref_and_says_why_otherwise",
]

# The second half of one rule: a remote URL's last path segment and a checkout's directory name are
# both repository-authored, so the value that fails the grammar is the one thing the refusal must
# not carry. The anchor is `PROJECT_NAME`, the loader's own grammar in the package, and the remedy —
# answer it with `--name`, or write `[project] name` yourself — is what a project whose directory
# this tool cannot name still has. The loader refuses the same grammar the same way.
[[mutation]]
name = "a detected name outside the grammar is quoted back in the refusal"
file = "src/stayfixed/project/detect.py"
before = '            raise Refusal(NOT_A_NAME)'
after = '            raise Refusal(f"{NOT_A_NAME}: {name}")'
reddens = [
  "tests/project/test_detect.py::test_a_name_outside_the_grammar_is_refused_without_being_quoted",
]

# Both passes are planned before either is applied, and that is the whole point: a refusal anywhere
