# The third half of the stale-bytecode header read, and the same class as `mutations/`'s "a
# hash-based .pyc is read as if it carried an mtime": PEP 552 bytes 8-12 are this interpreter's
# recorded source mtime only when bytes 0-4 are this interpreter's magic. A `__pycache__` keeps one
# `.pyc` per interpreter tag and nothing removes the old ones, so a `mod.cpython-311.pyc` records
# the mtime as of a run whose bytecode will never be imported again -- and any edit since makes it
# mismatch. Measured on a tree whose current bytecode had just been compiled and was fresh:
# `_stale_bytecode` -> 1, so the notice fires on every red run of a healthy tree and `test hygiene`
# exits 1 forever.
[[mutation]]
name = "a .pyc from another interpreter is read as this one's"
file = "src/stayfixed/profiles/python/hygiene.py"
before = '    if header[_PYC_MAGIC] != importlib.util.MAGIC_NUMBER:'
after = '    if False:'
reddens = ["tests/profiles/python/test_hygiene.py::test_a_pyc_from_another_interpreter_is_not_judged"]

# Which hint speaks is chosen by the command that failed. A hint that answered for every command
# would put Python's advice -- and the dirty-tree line, which only a recognised run earns -- on a
# failed `cargo test`, and spend the once-per-context delivery a failed test run needed.
[[mutation]]
name = "the Python hint recognises every command"
file = "src/stayfixed/profiles/python/hygiene.py"
before = "    def recognises(self, argv: Sequence[str]) -> bool:"
after = """    def recognises(self, argv: Sequence[str]) -> bool:
        return True"""
reddens = ["tests/profiles/test_hints.py::test_no_recognising_profile_means_no_notice"]

