# The publish group: `scripts/publish_plugin.py`, the owner's one command that pushes the plugin
# commit a release pinned to the plugin's own repository. Split from the tooling group by its
# largest area once that group reached its cap.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# `scripts/publish_plugin.py` pushes to the plugin repository only the commit the release's tag
# pins, built with the tag's own `scripts/plugin_tree.py` and `src/stayfixed`, attested, read back
# whole, compared by id with what GitHub holds, and only as one atomic fast-forward of `main` with
# the tag. It rejects (exit 1) a fact of the release no re-run changes and refuses (exit 2)
# anything else. Each of these drops one of those conditions.
#
# What the publisher no longer does has no entry here. The commit's objects, its git dir's
# template, hooks and object format, and a git that gave no answer are `scripts/plugin_tree.py`'s,
# held by `mutations/`'s "the plugin commit's git dir is made from the owner's init template",
# "the plugin commit runs the owner's hooks in its git dir" and "the plugin commit says a git that
# gave no answer exited". No file is hashed, so no filter converts one. The tag's version and tree
# are read by the tag's own code, held by `mutations/`'s "the plugin tree reads an object through
# a replace ref". A published tag is a comparison of ids, so no manifest of the remote's commit is
# read, and `main` is not compared once the tag names the commit.
[[mutation]]
name = "the publisher admits a tag with a suffix"
file = "scripts/publish_plugin.py"
before = "    if not re.fullmatch(TAG_PATTERN, tag):"
after = "    if not re.match(TAG_PATTERN, tag):"
reddens = [
  "tests/scripts/test_publish_plugin.py::test_a_tag_that_is_not_a_plain_version_is_refused[v1.2.3-rc1]",
]

[[mutation]]
name = "the publisher admits a tag spelled with digits that are not ASCII"
file = "scripts/publish_plugin.py"
before = 'TAG_PATTERN = r"v[0-9]+\.[0-9]+\.[0-9]+"'
after = 'TAG_PATTERN = r"v\d+\.\d+\.\d+"'
reddens = [
  "tests/scripts/test_publish_plugin.py::test_a_tag_that_is_not_a_plain_version_is_refused[v\\u0661.2.3]",
]

[[mutation]]
