# no relationship with. `red` is what gates the exit code, so the level here is a verdict something
# downstream reads -- an unconditional red makes `doctor` exit 1 in a repository that never opens
# the overlay. `memory.mode` is the gate, and it is compared and never printed.
[[mutation]]
name = "an unrelated overlay's declared floor reddens a project that never reads it"
file = "src/stayfixed/overlay/doctor.py"
before = '        unmet: Status = RED if context.config.memory.mode == OVERLAY_MODE else WARN'
after = "        unmet: Status = RED"
reddens = [
  "tests/overlay/test_doctor.py::test_a_local_only_project_is_warned_and_never_reddened_by_an_unrelated_floor",
  "tests/overlay/test_doctor.py::test_a_local_only_project_is_not_judged_by_an_unrelated_overlays_floor",
]

