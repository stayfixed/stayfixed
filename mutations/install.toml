# -- `_wrapper` takes `own_root` and nothing else -- so what it pins now is which wrapper `files`
# reads its mode from. A plugin's own and one a repository committed are different files with
# different meanings, and the row would otherwise report on the wrong one.
[[mutation]]
name = "doctor reads a named plugin root's files in preference to its own"
file = "src/stayfixed/doctor/checks.py"
before = "    return _own_root() or _named_root(env)"
after = "    return _named_root(env) or _own_root()"
