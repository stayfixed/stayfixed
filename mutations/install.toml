# The machine file is the owner's, by `README.md`'s own table, and every `setup` rewrites it.
# `[personal]` and `[machine]` were spread over what the file held; `[overlay]` replaced its
# table outright, so a hand-written key in it was gone after any run and a rootless `[overlay]`
# vanished whole -- silently, and again on the next run.
#
# The same spread is what carries a recorded root through a run that was not given one, which is the
# machine file's overlay anchor surviving a second `setup`: without it, a rewrite that only sets the
# personal values drops whatever `setup --overlay` recorded and every later `attach` reads "not
# recorded" about a machine that was already set up. That property had an entry of its own, on the
# explicit read-back this module used to do beside the spread; it SURVIVED, because the spread
# already held the property and the read-back was dead code shaped like a guard. The read-back is
# gone and the property is declared here, where the code that keeps it is.
[[mutation]]
name = "write_machine replaces the overlay table instead of merging over it"
file = "src/stayfixed/setup/machine.py"
before = '            **_table(existing, "overlay"),'
after = '            **({}),'
