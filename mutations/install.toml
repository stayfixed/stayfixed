# A compatibility gate, and the classic off-by-one site. `satisfies` is what tells a session and a
# `doctor` row whether the overlay the machine records can be driven by the stayfixed that is
# running; with `>` the version that meets a floor exactly is reported as not meeting it, so every
# project on the released version an owner wrote into `stayfixed.requires` is told to install
# something else, and the overlay's own shipped template declares such a floor. The anchor is this
# module's two grammars, in the installed package; what the owner authors is the floor.
[[mutation]]
name = "the declared floor stops being met by the version that equals it"
file = "src/stayfixed/overlay/requires.py"
before = "    return ours > wanted or (ours == wanted and not pre_release(version))"
after = "    return ours > wanted"
reddens = [
  "tests/overlay/test_requires.py::test_a_suffix_later_leaves_unordered_still_meets_the_floor_by_its_triple",
  "tests/overlay/test_requires.py::test_the_floor_is_compared_as_numbers_not_as_text",
  "tests/overlay/test_requires.py::test_the_floor_is_met_by_a_later_triple_or_its_own_and_never_a_pre_release_of_it[1.0.0-True]",
]

# The floor's own triple is met only by a version that is no pre-release of it, in the one reading
# of a pre-release `semver.later` orders by: by the triple alone a `1.0.0rc1` build met `>=1.0.0`,
# which `later` orders after it.
[[mutation]]
name = "the declared floor is met by a pre-release of it"
file = "src/stayfixed/overlay/requires.py"
before = "    return ours > wanted or (ours == wanted and not pre_release(version))"
after = "    return ours >= wanted"
reddens = [
  "tests/overlay/test_requires.py::test_a_pre_release_of_the_floor_does_not_meet_it[1.0.0rc1]",
  "tests/overlay/test_requires.py::test_a_pre_release_of_the_floor_does_not_meet_it[1.0.0.dev0]",
  "tests/overlay/test_requires.py::test_a_pre_release_of_the_floor_does_not_meet_it[1.0.0-rc.1]",
  "tests/overlay/test_requires.py::test_a_pre_release_of_the_floor_does_not_meet_it[1.0.0a1]",
