# `memory.groups` is repository-authored and reaches no guard of its own (`config/paths.py`
# leaves the containment to the module that consumes the field). The entry decides a
# directory created inside the OVERLAY -- the one tree `attach` trusts -- so `fsops` refusing it
# has to reach the caller as a refusal and not as silence.
#
# And it has to reach the caller BEFORE the first write. The containment used to be called only
# from `_prepare_store`, which runs after the ignore region, the `.codex/rules/` copies, the
# settings merge, the ledger and the overlay's binding record -- so a clone committing an
# escaping entry got five artifacts written and exit 2, and `doctor` then reported the
# repository attached and the binding *bound*, because the record had been written too. The
# mutation takes the hoisted call away and leaves only the write-time one.
#
# Anchored on the call and not on the `load` above it, which is where it used to be anchored and
# which moved to the top of `attach` when the second load of the run was removed. The guard is
# that this check is asked, and the line that asks it is the one this entry should break.
[[mutation]]
name = "the memory.groups containment is asked at write time only"
file = "src/stayfixed/attach/write.py"
before = "    _check_groups(binding, config)"
after = "    pass  # `_check_groups` is not asked"
reddens = [
  "tests/attach/test_write.py::test_a_memory_group_that_leaves_the_projects_share_is_refused_not_created",
]

