# `detach` cannot refuse once it has begun — by the time it reaches the link tree the settings
# and the `.codex/rules/` copies are gone, and refusing there strands a half-detached repository.
# So everything structural it *can* know beforehand has to be asked beforehand. `main_checkout`
# and `_worktrees` are the only things here that need `git`, they are pure reads, and they sat
# between the settings withdrawal and the link trees: a machine whose `git` was gone got exit 1
# with two artifacts already removed and every link still in place.
[[mutation]]
name = "detach asks git where the checkouts are after it has already withdrawn"
file = "src/stayfixed/attach/write.py"
# The block this moves runs from the anchor loop through the manifest's answer to the region read.
# What it proves: `git` is asked before the first withdrawal, and a `git` that cannot run must not
# strand a half-detached repository.
before = '''    checkouts = _checkouts(root)
    for tree in checkouts:
        harness_anchor(tree, home)
    ignore_remainder = None if _footprint_owns_region(root) else _ignore_region_remainder(root)
    # The `info/exclude` block is found above the first withdrawal for the same reason: `git`
    # names the file and a region opened twice refuses, and both are knowable now. It is shared
    # by every checkout while the ledger, the settings file and the `.codex/rules/` copies are
    # each checkout's own, so it stays while another checkout still holds a ledger: taking it
    # would show that checkout's settings file and rule copies in its `git status`.
    kept = _another_attached(root, checkouts)
    hidden = None if kept else exclude.withdrawn_block(root)
    settings = _planned_settings(root, recorded)
    _refuse_unwithdrawable(root, recorded, checkouts, config, settings)
    allow_removed = _withdraw_settings(root, settings)'''
after = '''    ignore_remainder = None if _footprint_owns_region(root) else _ignore_region_remainder(root)
    settings = _planned_settings(root, recorded)
    allow_removed = _withdraw_settings(root, settings)
    checkouts = _checkouts(root)
    for tree in checkouts:
        harness_anchor(tree, home)
    kept = _another_attached(root, checkouts)
    hidden = None if kept else exclude.withdrawn_block(root)
    _refuse_unwithdrawable(root, recorded, checkouts, config, settings)'''
