# The overlay root comes from the machine file, and this is the rule whose failure hands the choice
# of overlay to whoever wrote the command line -- which in this harness is a model that has read the
# repository. The machine file is unselectable by a repository by construction; `--store`'s own
# parent is not.
[[mutation]]
name = "attach takes the overlay root from its argument instead of the machine file"
file = "src/stayfixed/attach/binding.py"
# Widened past `read_binding`'s own line: `binding_for` has the same `overlay =
# overlay_root(machine)` line, so a one-line `before` is not unique in this file — the oracle
# refuses rather than mutating an ambiguous match, so a non-unique `before` goes uncaught until a
# sweep broader than the entry's own filter string surfaces it.
#
# `read_binding` takes an optional `config` and loads only when the caller holds none, which is how
# the first of the two lines is spelled. The mutation is the second line -- the guard -- and the
# first is here only for uniqueness.
before = '''    config = load(root, machine=machine) if config is None else config
    overlay = overlay_root(machine)'''
after = '''    config = load(root, machine=machine) if config is None else config
    overlay = store.parents[2]'''
reddens = [
  "tests/attach/test_binding.py::test_the_overlay_root_comes_from_the_machine_file_and_not_from_the_argument",
]

