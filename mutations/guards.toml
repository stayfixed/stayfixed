# The guards group: the checks that judge a command, a commit or a test run.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# A `#` opens a comment only at the start of a word. `shlex`'s own `commenters` ends a token
# at ANY unquoted `#`, which truncated `echo a#b && cat secrets/.env` to `['echo', 'a']` and
# dropped a real command on the floor.
[[mutation]]
name = "a mid-word hash opens a comment again"
file = "src/stayfixed/guards/bashscan.py"
before = '        elif character == "#" and _starts_a_word(previous):'
after = '        elif character == "#":'
reddens = [
  "tests/guards/test_bashscan.py::test_a_mid_word_hash_does_not_truncate_the_command",
  "tests/guards/test_bashscan.py::test_a_hash_inside_a_path_argument_survives",
]

