# The release check's `--tag` derived the drift message with `tag.split("v", 1)[-1]`, so
# `--tag 1.2.3` reported `tag 1.2.3 names 1.2.3` — two identical strings asserted to disagree.
[[mutation]]
name = "the tag drift message invents a version by splitting on the letter v"
file = "scripts/release.py"
before = """
            workflow_tag, platform_tag = tag_for(canonical)
            problems.append(
                f"tag {tag} is neither {workflow_tag} nor {platform_tag}; "
                f"{PYPROJECT} says {canonical!r}"
            )"""
after = """
            named = tag.split("v", 1)[-1]
            problems.append(f"tag {tag} names {named}; {PYPROJECT} says {canonical!r}")"""
reddens = [
  "tests/scripts/test_release.py::test_the_drift_message_says_what_was_checked_rather_than_inventing_a_version",
]

# --- The release script returns its findings as every command does ---------------------------
# While these were the installed CLI's `release` group, it was the one area reporting a finding
# by raising `Failure`, and the cost was in `--json`: the frame (which the script still runs
# through) turns a `Failure` into `{"error": "failed", ...}` and drops `Result.data`, so the
# machine-readable object changed shape on exactly the condition a consumer runs the command to
# detect. `{}` for the drift arm's data is precisely what raising produced.
[[mutation]]
name = "release check's drift arm carries no data again"
file = "scripts/release.py"
before = '        return Result("version drift: " + "; ".join(problems), data, exit_code=1)'
after = '        return Result("version drift: " + "; ".join(problems), {}, exit_code=1)'
reddens = [
  "tests/scripts/test_release.py::test_the_json_object_has_the_same_shape_whether_or_not_there_is_drift",
]

[[mutation]]
name = "release hashes --check's drift arm carries no data again"
file = "scripts/release.py"
before = '            return Result("release record drift: " + "; ".join(problems), data, exit_code=1)'
after = '            return Result("release record drift: " + "; ".join(problems), {}, exit_code=1)'
reddens = [
  "tests/scripts/test_release.py::test_the_check_json_object_has_the_same_shape_whether_or_not_there_is_drift",
]

