# its own help string again" already proves load-bearing.

# The oracle's own job, from the two sides that go quiet rather than loud. A budget that no
# longer fits the set it has to prove is the failure this shape exists to end, and it is worth
# catching in a test run rather than fifteen minutes into a cancelled job. A job that can be
# skipped is worse: GitHub reports a skipped job as a green check, so the whole set switches off
# and says nothing. `before` carries two lines in a basic string, because a literal string would
# make `\n` two characters and the entry would match nothing.
[[mutation]]
name = "the oracle's job keeps a budget that no longer fits its own set"
file = ".github/workflows/ci.yml"
before = "    timeout-minutes: 12"
after = "    timeout-minutes: 1"
reddens = [
  "tests/test_fixtures.py::test_the_mutation_oracle_has_a_job_of_its_own_with_a_budget_that_fits",
]

[[mutation]]
