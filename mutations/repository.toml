name = "coverage's per-worker data files reach the neutrality gate again"
file = ".gitignore"
before = ".coverage.*\n"
after = ""
reddens = [
  "tests/test_neutral.py::test_a_coverage_worker_file_is_not_a_file_the_gate_walks",
]

# The same files in an unpacked sdist, where no `.gitignore` applies and the fallback walk reads
