# every PreToolUse, before any stayfixed guard. `config/machine.py`'s ruling -- "gating one of a pair
# of equivalent inputs is not a partial defence, it is a redirect with a longer name" -- is followed
# by putting that module's own gate on it: an interactive terminal, which a hook's stdin (the
# harness's payload, on a pipe) never is.
