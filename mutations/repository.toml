# `STAYFIXED_PYTHON_CANDIDATES` gated, the hook path always uses the built-in list, whose last entry
# is a `PATH` lookup -- and `PATH` reaches this process from the same committed `env` block.
# Dropping the entry is not available (it is the fall-through for an interpreter that is only on
# `PATH`, and a pyenv, nix or asdf machine has nothing at the four absolute paths), so what a clone
# can actually stage is refused instead: an interpreter inside its own tree. Measured with the entry
# disabled -- a shipped `python3` plus a `PATH` entry naming the tree ran `<plugin>/scripts/stayfixed
# hook PreToolUse`.
[[mutation]]
name = "the wrapper runs an interpreter the project itself ships"
file = "hooks/run-hook.sh"
before = '  if in_project "$resolved"; then'
after = '  if false; then'
reddens = [
  "tests/hooks/test_wrapper.py::test_an_interpreter_inside_the_project_root_is_never_used",
  "tests/hooks/test_wrapper.py::test_an_interpreter_reached_through_path_is_judged_by_its_resolved_path[a PATH entry naming the tree]",
  "tests/hooks/test_wrapper.py::test_an_interpreter_reached_through_path_is_judged_by_its_resolved_path[a . in PATH]",
]

# Both sides resolved, or the comparison is a string game. `command -v` answers a `PATH` entry's
# own spelling, so a symlinked entry names a directory outside the tree that IS the tree.
[[mutation]]
name = "the interpreter containment compares a candidate's spelling instead of its resolved path"
file = "hooks/run-hook.sh"
before = '  dir=$(CDPATH= cd -- "$(dirname -- "$1")" 2>/dev/null && pwd -P) || return 1'
after = '  dir=$(dirname -- "$1") || return 1'
reddens = [
  "tests/hooks/test_wrapper.py::test_an_interpreter_reached_through_path_is_judged_by_its_resolved_path[a symlinked PATH entry]",
]

# The same, for the other side. A project reached through a symlink is one spelling in
# `CLAUDE_PROJECT_DIR` and another on disk, and the containment then reads "outside" for every
# candidate in the tree.
[[mutation]]
name = "the interpreter containment compares against the project root's spelling"
file = "hooks/run-hook.sh"
before = '  project=$(pwd -P)'
after = '  project="$root"'
reddens = [
  "tests/hooks/test_wrapper.py::test_an_interpreter_reached_through_path_is_judged_by_its_resolved_path[a symlinked project root]",
]

# The half a blunt containment gets wrong. No `CLAUDE_PROJECT_DIR` and no `git` answer is not a
# project this process can name, and refusing every candidate on a question it could not ask
# would turn an unresolvable root -- the ordinary state outside a repository -- into no hooks.
[[mutation]]
name = "an unresolvable project root refuses every interpreter instead of none"
file = "hooks/run-hook.sh"
before = '  [ -n "$2" ] || return 1'
after = '  [ -n "$2" ] || return 0'
reddens = [
  "tests/hooks/test_wrapper.py::test_a_candidate_stands_when_there_is_no_project_root_to_compare_it_against",
]

# The wrapper's other half. `hooks/dispatch._git_toplevel` scrubs this identical call one layer
# down and names the failure verbatim; the wrapper inherited whatever the session had, so
# `GIT_DIR`/`GIT_WORK_TREE` chose the project -- and every entry but the dispatcher's relies on
# `--root` defaulting to `.`, so the whole hook then read another repository's configuration,
# budgets and note store. The Codex hot path, where `CLAUDE_PROJECT_DIR` is unset.
[[mutation]]
name = "the wrapper's git inherits the session's GIT_DIR again"
file = "hooks/run-hook.sh"
before = 'git_root=$(env -i PATH=/usr/bin:/bin HOME="${HOME:-}" "$git_bin" rev-parse --show-toplevel 2>/dev/null || true)'
after = 'git_root=$("$git_bin" rev-parse --show-toplevel 2>/dev/null || true)'
reddens = [
  "tests/hooks/test_wrapper.py::test_the_project_root_is_never_taken_from_an_inherited_git_environment",
]

# `-f` tests existence, not readability. Measured with `chmod 000`: CPython printed its own
# "Permission denied" and exited 2 with no SF_ token, passed through by `case "$rc" in 0|2)` -- the
# unattributed exit 2 the wrapper exists to make impossible, and a state `doctor`'s wrapper row
# called green because it keys on finding a token.
[[mutation]]
name = "the wrapper stops noticing that its launcher cannot be read"
file = "hooks/run-hook.sh"
before = '[ -f "$launcher" ] && [ -r "$launcher" ] || fail "SF_NO_LAUNCHER launcher missing or unreadable at ${launcher}"'
