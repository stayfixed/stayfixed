[[mutation]]
name = "the README drops the git fetch row"
file = "README.md"
before = "| `git fetch` | `stayfixed bugs new` | the project's `origin` (note 1) | unless `--no-fetch` |"
after = ''
reddens = ["tests/test_outbound.py::test_the_readme_declares_every_program_that_reaches_a_network"]

# Every file the templates write under `.github/` is something GitHub runs, so each is a README row;
# a template workflow added without one must redden.
[[mutation]]
name = "the template GitHub files stop being README rows"
file = "tests/test_outbound.py"
before = '    return shipped | {CI_WORKFLOW}'
after = '    return {CI_WORKFLOW}'
reddens = ["tests/test_outbound.py::test_the_readme_declares_every_program_that_reaches_a_network"]

# A launch whose program the outbound walk cannot read is allowed only as a declared pass-through;
# one that loses its declaration must be a finding, or a new such launch would be too.
[[mutation]]
name = "a launch the outbound walk cannot read loses its declaration"
file = "tests/outbound/policy.py"
before = '    ("src/stayfixed/attach/exclude.py", "unhidden_by_owner", "*asked"): NO_ROWS,'
after = ''
reddens = ["tests/test_outbound.py::test_every_launch_is_classified"]

# A declaration names one value handed to one launch; keyed on its function alone, it would exempt
# every other unread launch a later change adds there.
[[mutation]]
name = "a declaration covers every launch in its function again"
file = "tests/test_outbound.py"
before = '    return launch.file, launch.function, element.text'
after = '    return launch.file, launch.function, next((k[2] for k in (*PASS_THROUGH, *VOUCHED_ELEMENTS) if k[:2] == (launch.file, launch.function)), element.text)'
reddens = [
  "tests/test_outbound.py::test_a_declaration_covers_only_the_launch_it_names[another-expression]",
]

# A declaration no launch relies on any more is ready to excuse the next launch that hands its
# value.
[[mutation]]
name = "a vouched element names a value no launch hands"
file = "tests/outbound/policy.py"
before = '    ("src/stayfixed/ledger/check.py", "_base_ledger", "fork"): "a merge base git printed",'
after = '''    ("src/stayfixed/ledger/check.py", "_base_ledger", "fork"): "a merge base git printed",
    ("src/stayfixed/ledger/check.py", "_base_ledger", "base"): "a merge base git printed",'''
reddens = [
  "tests/test_outbound.py::test_the_declarations_name_exactly_what_the_classification_rests_on",
]

# Every program a launch runs is classified as reaching a network or not; one in neither table
