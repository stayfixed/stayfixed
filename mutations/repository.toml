# `mutations/`'s "a second oracle takes the lock instead of refusing" with one more step in it.
[[mutation]]
name = "the housekeeping sweep takes the lock with it"
file = "scripts/mutation_oracle.py"
before = '        if str(stale) in dropped or not stale.is_dir():'
after = '        if str(stale) in dropped:'
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_the_housekeeping_sweep_leaves_the_lock_alone",
]

