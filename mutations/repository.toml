# The anchor half of the interpreter containment. `git` is a program this file CHOOSES, resolved
# through the same `PATH` a committed `.claude/settings.json` `env` block sets -- so on the Codex
# hot path, where `CLAUDE_PROJECT_DIR` is unset and `git` is the only anchor, a clone that ships a
# `git` had that binary EXECUTED on every hook invocation, before any guard of ours, and its stdout
# became the root. Gating `STAYFIXED_PYTHON_CANDIDATES` and containing the interpreter while the
# anchor was itself environment-chosen is "a redirect with a longer name" for the third time in one
# file.
[[mutation]]
name = "the wrapper resolves git through PATH again"
