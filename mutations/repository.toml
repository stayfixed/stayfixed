# The repository group: everything outside the package — tests, scripts, hooks, workflows, docs.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# The oracle's own two guards, declared here like any other. Self-mutation works because
# `_check` rewrites the file on disk and the run it then launches is a subprocess that loads
# this script fresh from that path — the parent's already-imported copy decides nothing.
[[mutation]]
name = "the oracle stops proving the named tests pass before it mutates"
file = "scripts/mutation_oracle.py"
before = '    if not clean.passed:'
after = '    if False:'
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_a_test_id_that_does_not_exist_is_a_finding_not_a_catch",
  "tests/scripts/test_mutation_oracle.py::test_a_run_where_every_named_test_skipped_proves_nothing",
]

[[mutation]]
name = "the oracle reads a git that could not answer as a clean tree again"
file = "scripts/mutation_oracle.py"
before = '    if status.returncode != 0:'
after = '    if False:'
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_a_tree_git_cannot_answer_about_is_refused_not_assumed_clean",
]

# The neutrality gate stores its denylist as digests so the file that hides a name does not publish
# it, which means the match is a windowed hash comparison rather than a substring test — an
# invisible mechanism whose failure mode is silence. Empty the per-width digest set and every scan
# comes back clean: the whole-tree walk goes green over a tree that could name anything.
[[mutation]]
name = "the hashed neutrality denylist stops matching a planted token"
file = "tests/test_neutral.py"
before = '        wanted = {digest for length, digest in forbidden if length == width}'
after = '        wanted = set()'
reddens = [
  "tests/test_neutral.py::test_the_gate_discriminates",
]

# The public-document half of the same gate, which had no entry in `mutations/` until two rounds of
# review found two holes in it. `PUBLIC_FORBIDDEN` is the full table minus the digests of the paths
# the preset itself ships, so that a README may say where the note store lives by default. Written
# by hand as the full table instead, the exemption disappears and every public document that names a
# default path reddens; written as the full table is also the shape a well-meaning "simplification"
# takes, and the derivation fails silently either way.
[[mutation]]
name = "the public document table is written by hand instead of derived from the preset"
file = "tests/test_neutral.py"
before = 'PUBLIC_FORBIDDEN = tuple(entry for entry in FORBIDDEN if entry not in _preset_paths())'
after = 'PUBLIC_FORBIDDEN = FORBIDDEN'
reddens = [
  "tests/test_neutral.py::test_the_exemption_is_exactly_the_presets_default_paths",
  "tests/test_neutral.py::test_the_public_table_still_discriminates",
]

# The vendor-branch arm, whose failure mode is silence and whose history is a hole per round of
# review: first a bare name only, then a bare name plus three hardcoded remote names. The
# replacement accepts any path or remote prefix; drop that and every prefixed form — a remote
# nobody listed, a `refs/` ref, this repository's own branch prefix, a worktree path — walks
# straight through a gate that reports nothing.
[[mutation]]
name = "the vendor-branch arm stops seeing a prefixed branch name"
file = "tests/test_neutral.py"
before = '        re.compile(r"(?<![.\w])(?:[\w.-]+/)*(?:codex|claude|cursor)/[a-z0-9][\w-]*[-_][\w-]*"),'
after = '        re.compile(r"(?<![.\w/])(?:codex|claude|cursor)/[a-z0-9][\w-]*"),'
reddens = [
  "tests/test_neutral.py::test_the_gate_discriminates",
]

# The other half of the replacement `mutations/`'s "the vendor-branch arm stops seeing a prefixed
# branch name" makes, and it cuts both ways, so it is two entries. The vendor arm reads the text
# with its URLs blanked out, which is the only thing between the gate and a documentation URL whose
# path segment after a vendor name happens to be dashed — the commonest shape one has. Without it
# the gate cries wolf on every public document that cites one, which is how an arm gets loosened in
# the first place.
[[mutation]]
name = "the vendor arm reads a URL as if it were prose"
file = "tests/test_neutral.py"
before = '        name for name, shape in SHAPES if shape.search(blanked if name in URL_BLIND else lowered)'
after = '        name for name, shape in SHAPES if shape.search(lowered)'
reddens = [
  "tests/test_neutral.py::test_the_public_table_still_discriminates",
]

# And the other direction, which is the one that shipped for three commits: blanking for *every*
# arm takes the personal address and the commit id out of every URL in the tree — a `mailto:`, a
# profile link, a `?sha=` parameter — which is the gate's whole subject matter. Only the vendor
# arm has a legitimate reason to meet its own shape inside a URL path.
[[mutation]]
name = "every arm goes blind inside a URL"
