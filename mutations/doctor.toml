            pass'''
reddens = [
  "tests/doctor/test_checks.py::test_a_settings_file_that_cannot_be_read_is_reported_rather_than_skipped",
]

# Reasons, never payloads. The sink's record carries `context` and `decision`, both filled from a
# handler's own return value, and printing the record whole is the one place a repository's bytes
# could reach a terminal — and the model reading it — unwrapped. The allowlist is the guard; without
# it the check prints everything the record holds.
[[mutation]]
name = "doctor quotes a diagnostics log whose provenance it cannot establish"
file = "src/stayfixed/doctor/checks.py"
before = '        f"{counted}; {sessions} session(s) seen. Not one line is quoted: {UNVOUCHED_LOG}",'
after = '        f"{counted}; {sessions} session(s) seen: " + raw.decode("utf-8", "replace"),'
reddens = [
  "tests/doctor/test_checks.py::test_a_diagnostics_log_the_environment_named_is_counted_and_never_quoted",
  "tests/doctor/test_checks.py::test_a_log_larger_than_the_sink_would_ever_write_is_read_to_a_bound",
]

