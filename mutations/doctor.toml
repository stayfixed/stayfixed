# The one call this area makes that leaves the machine, and the five-minute cap it inherited.
# `NETWORK_TIMEOUT_SECONDS` is written for `gh repo create --clone` and the clone behind it; the
# `ci-ref` row reads one tag listing, on a command that prints one line of output and `docs/cli.md`
# calls a diagnostic. `stayfixed init` recording a `[ci] ref` is what made the block reachable at
# all. Two entries, this one and `mutations/`'s "the runner ignores the bound its caller asked for",
# because the choice and the honouring of it are in different modules: without the second, a
