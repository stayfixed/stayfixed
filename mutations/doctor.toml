# The `ci-ref` row's two missing guards, and both are about a path the *repository* authors:
# `.github/workflows/stayfixed.yml`. This row read it with neither of the guards its two siblings in
# the same module have -- `hook_entries` asks `is_file()` of every settings file before it opens
# one, and `_diagnostics` reads its log to a cap -- so a committed symlink to a FIFO made
# `read_text` block with nothing to read, and `doctor`, which is one line of output and has no
# timeout of its own, never returned. Measured on a real FIFO before the guard: the row did not come
# back. None of the bytes reaches the report either way, so this is containment hygiene rather than
# a leak, which is why it is a guard and not a refusal.
[[mutation]]
name = "doctor reads the rendered workflow without asking what it is"
file = "src/stayfixed/doctor/checks.py"
before = """    if not fsops.is_file(workflow):
        if fsops.exists(workflow) or fsops.is_symlink(workflow):"""
after = """    if False:
        if fsops.exists(workflow) or fsops.is_symlink(workflow):"""
reddens = [
  "tests/doctor/test_checks.py::test_a_workflow_that_is_not_a_file_does_not_hang_the_row",
]

# Over the bound is itself an answer, which is the sibling rule of `mutations/`'s "doctor reads an
# environment-named log with no bound of its own" one function down: a workflow `init` rendered is
# under 2 KiB, a file a clone committed there has no cap at all, and a `uses:` line past the bound
# would be compared against bytes nobody read. So the arm must not fall through to the ref's own
# verdict, which is what this entry breaks.
#
# **What has no entry, and why: an unbounded read itself.** A read of the whole file and the bounded
# one answer "over the bound" identically -- the difference is how many bytes were held to answer
# it, and no assertion at a testable file size can see that. Measured rather than assumed: this
# entry's `after` was an unbounded read on its first run and the oracle reported it survived, which
# is the finding that produced this paragraph. The sibling `_diagnostics` entry does redden, because
# that row counts records *inside* what it read and an unbounded read counts more of them; this row
# returns above its count. The bound on the read itself is `fsops.read_bounded`'s, held by
# `mutations/`'s "the regular-file reader reads past its limit" and "the regular-file reader refuses
# a file at its limit".
[[mutation]]
name = "doctor reads the rendered workflow with no bound of its own"
file = "src/stayfixed/doctor/checks.py"
before = "    if over:\n        # Over the cap is itself an answer"
after = "    if False:\n        # Over the cap is itself an answer"
reddens = [
  "tests/doctor/test_checks.py::test_a_workflow_over_the_cap_is_not_the_refs_own_verdict",
]

