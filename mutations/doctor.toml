# The doctor group: the report on an installation — the core's checks and the run that asks
# them, the rows the areas contribute, and `hook-entries` with its walk of the settings files.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# In the block led by `mutations/`'s "the runner decodes a launched program's output strictly
# again": a launched program's output is read with replacement characters, never strictly.
[[mutation]]
name = "doctor's wrapper row decodes the wrapper's stderr strictly again"
file = "src/stayfixed/doctor/checks.py"
before = '            errors="replace",'
after = '            errors="strict",'
reddens = [
  "tests/doctor/test_checks.py::test_a_wrapper_refusal_that_quotes_bytes_that_are_not_text_is_still_read",
]

# Which plugin root `doctor` trusts, first half. This ordering no longer decides what is *executed*
# -- `_wrapper` takes `own_root` and nothing else -- so what it pins now is which wrapper `files`
# reads its mode from. A plugin's own and one a repository committed are different files with
# different meanings, and the row would otherwise report on the wrong one.
[[mutation]]
name = "doctor reads a named plugin root's files in preference to its own"
file = "src/stayfixed/doctor/checks.py"
before = "    return _own_root() or _named_root(env)"
after = "    return _named_root(env) or _own_root()"
reddens = [
  "tests/doctor/test_checks.py::test_a_named_plugin_root_never_outranks_the_one_this_stayfixed_is_part_of",
]

# Which plugin root `doctor` trusts, and the entry that matters: `doctor` runs a subprocess out of
# this answer. With `_own_root()` returning `None` -- which a `uv tool install` wheel gives, and
# which `cli-path`'s own remedy and the README tell people to install -- a project that commits
# `hooks/run-hook.sh` mode 100755 plus an `env` block naming its tree got that script RUN, and the
# report then read `wrapper: ok`. Code execution and a false clean bill of health from a read-only
# command.
[[mutation]]
name = "doctor executes the plugin root the environment named"
file = "src/stayfixed/doctor/checks.py"
before = "    root = context.own_root"
after = "    root = context.plugin_root"
reddens = [
  "tests/doctor/test_checks.py::test_a_plugin_root_the_environment_named_is_read_and_never_executed",
]

# The other half of the same containment: `files` keeps reading the wrapper's mode, because that
# needs only a path -- and must say whose root it measured, so nobody reads "executable" off a
# repository-planted file as a clean bill of health for the installation.
[[mutation]]
name = "doctor reports on a named plugin root's files without saying whose they are"
file = "src/stayfixed/doctor/checks.py"
before = '    whose = "" if context.own_root is not None else NAMED_ROOT_CAVEAT'
after = '    whose = ""'
reddens = [
  "tests/doctor/test_checks.py::test_a_plugin_root_the_environment_named_is_read_and_never_executed",
]

# The same check's other half, and the one a green report hides. Three arms used to swallow — an
# OSError on the read, a JSON error inside the walk, and a Refusal out of `owned_ids` — and all
# three produced "all accounted for" from the check whose whole purpose is that nobody's entries
# go unlisted. `owned_ids` is asked here for its strictness: it shares its reader with
# `apply_entries`, so a shape the merge would refuse is a shape this walk must admit it cannot
# account for.
[[mutation]]
name = "doctor swallows a settings file it could not read instead of reporting it"
