# The other way to read a byte that is not UTF-8, and the one that fails open: as no answer.
# Four callers read that as "nothing" and passed what they exist to refuse — `setup` recorded a
# sibling checkout of the project as the trust anchor, `test attribute` skipped the export-rule
# comparison, the docs trail's ignore filter listed a local-only document in the roadmap, and
# `assess` reported could-not-look over a committed `.env` — and the plan gate failed every run
# of a repository holding one such plan name.
[[mutation]]
name = "the git runner reads an answer that is not UTF-8 as no answer again"
file = "src/stayfixed/gitenv.py"
before = """    answer = completed.stdout.decode(codec, "surrogateescape")
    return completed.returncode, answer"""
