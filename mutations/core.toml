# Two readers of `stayfixed.toml` followed two rules: `read_document` refuses a symlink, and
# `load` read the file with a plain `read_text`, so `adopt`, `bugs check`, `plan check` and the
# rest followed a clone's `stayfixed.toml -> /dev/zero` until memory ran out. `load` reads through
# `read_document` now; the case's link points at a valid document, so a reader that follows it
# loads and goes on, and a regression cannot hang the run.
[[mutation]]
name = "load follows a symlinked stayfixed.toml"
file = "src/stayfixed/config/loader.py"
before = """
    text = read_document(root)
    if text is None:
        raise ConfigError(NOT_THERE.format(path=root / CONFIG_FILE))
"""
after = """
    text = (root / CONFIG_FILE).read_text(encoding="utf-8")
    if text is None:
        raise ConfigError(NOT_THERE.format(path=root / CONFIG_FILE))
"""
