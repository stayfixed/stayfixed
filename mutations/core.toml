  "tests/config/test_symlinked_document.py::test_load_refuses_a_symlinked_stayfixed_toml",
  "tests/config/test_symlinked_document.py::test_every_command_family_refuses_a_symlinked_stayfixed_toml[bugs-check]",
  "tests/assess/test_command.py::test_a_symlinked_stayfixed_toml_is_refused_and_never_followed",
]

