# A containment ruling and its anchor's provenance. Nothing reserved git's control directory:
# `PATH_VALUE` admits a leading dot, and `contained()` and this walk each refused an absolute path,
# `..` and a symlink — a control directory is none of those. So a clone could aim a `MANAGED_REGION`
# artifact at `.git/hooks/pre-commit`, which the engine's "exists and stayfixed did not write it"
# guard exempts, and `_mode_of` then carried the developer's 0755 onto the replacement. The anchor
# is the project root the CLI resolved and `.git` is git's own name inside it, so the clone — which
# authors the path string and nothing else — cannot move the directory being reserved. Measured:
# with the check dropped here, `write_within` creates `.git/stayfixed-roadmap.md` and rewrites an
# existing executable `pre-commit` in place at 0755.
[[mutation]]
name = "the walk writes inside git's control directory again"
file = "src/stayfixed/fsops.py"
before = "    if names_control_directory(relative):"
after = "    if False:"
reddens = [
  "tests/test_fsops.py::test_gits_control_directory_is_reserved_at_every_depth_and_in_any_case",
  "tests/test_fsops.py::test_an_existing_git_hook_is_never_rewritten_in_place",
  "tests/config/test_paths.py::test_contained_refuses_gits_control_directory_at_any_depth_and_in_any_case",
]

