# text, so interpolating the exception whole put unbounded repository bytes into a `ConfigError`
# and, through `project.init._existing`, into a refusal the `init` skill is instructed to relay to a
# model and stop on. Only the position prints, and the fallback reports an absent suffix rather than
# the message — a fallback to `str(exc)` is the one change that would reopen this silently. The
