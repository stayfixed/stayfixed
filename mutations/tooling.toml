# The marketplace entry pins the plugin repository's commit by `sha`, a function of the release
# commit alone. These weaken how the workflows compute it, gate on it and install by it: the
# release reads the first parent's pin from a clone that lacks it, the job that runs the suite
# can sign again, `attest` hands on a commit the release commit does not pin, the gated jobs
# compare the tag object or another tag's line or ask another repository, the smoke installs by
# `ref` alone or builds a commit whose parent its scratch repository lacks, and the validator
# stops seeing an entry that carries a `sha`.
[[mutation]]
name = "the release build fetches the tag's commit alone"
file = ".github/workflows/release.yml"
before = "        with:\n          fetch-depth: 2\n      - uses: astral-sh/setup-uv"
after = "      - uses: astral-sh/setup-uv"
reddens = [
  "tests/test_check_workflow.py::test_build_fetches_the_first_parent[build]",
]

[[mutation]]
name = "the release build can sign again"
file = ".github/workflows/release.yml"
before = "  build:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    permissions:\n      contents: read\n"
after = "  build:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    permissions:\n      id-token: write\n      contents: read\n"
reddens = [
  "tests/test_check_workflow.py::test_only_the_attest_job_can_attest",
]

[[mutation]]
name = "the attest job hands on a commit the release commit does not pin"
file = ".github/workflows/release.yml"
before = '            --require-pin --json > "$RUNNER_TEMP/plugin-commit.json"'
after = '            --json > "$RUNNER_TEMP/plugin-commit.json"'
reddens = [
  "tests/test_check_workflow.py::test_the_attest_job_hands_on_the_commit_its_source_pins",
]

# The gated step is written twice, once in each job behind the approval, so each of these anchors
# on `publish`'s copy through the job's own permissions above it.
[[mutation]]
name = "the plugin gate asks another repository"
file = ".github/workflows/release.yml"
before = '''      contents: read
    steps:
      - name: The plugin repository holds this release's commit
        env:
          TAG: ${{ github.ref_name }}
          PINNED: ${{ needs.attest.outputs.commit }}
        run: |
          listing="$(git ls-remote https://github.com/stayfixed/stayfixed-plugin.git'''
after = '''      contents: read
    steps:
      - name: The plugin repository holds this release's commit
        env:
          TAG: ${{ github.ref_name }}
          PINNED: ${{ needs.attest.outputs.commit }}
        run: |
          listing="$(git ls-remote https://github.com/stayfixed/stayfixed-plugins.git'''
reddens = [
  "tests/test_check_workflow.py::test_one_plugin_repository_everywhere",
]

[[mutation]]
name = "the plugin gate compares the tag object of an annotated tag"
file = ".github/workflows/release.yml"
before = '''      contents: read
    steps:
      - name: The plugin repository holds this release's commit
        env:
          TAG: ${{ github.ref_name }}
          PINNED: ${{ needs.attest.outputs.commit }}
        run: |
          listing="$(git ls-remote https://github.com/stayfixed/stayfixed-plugin.git "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "::error::stayfixed/stayfixed-plugin could not be listed; re-run this job, or see RELEASING.md section 2, step 7"
            exit 1
          }
          tagged=""
          peeled=""
          while IFS=$'\t' read -r id ref; do
            case "$ref" in
              "refs/tags/$TAG") tagged="$id" ;;
              "refs/tags/$TAG^{}") peeled="$id" ;;
            esac
          done <<< "$listing"
          found="${peeled:-$tagged}"'''
after = '''      contents: read
    steps:
      - name: The plugin repository holds this release's commit
        env:
          TAG: ${{ github.ref_name }}
          PINNED: ${{ needs.attest.outputs.commit }}
        run: |
          listing="$(git ls-remote https://github.com/stayfixed/stayfixed-plugin.git "refs/tags/$TAG" "refs/tags/$TAG^{}")" || {
            echo "::error::stayfixed/stayfixed-plugin could not be listed; re-run this job, or see RELEASING.md section 2, step 7"
            exit 1
          }
          tagged=""
          peeled=""
          while IFS=$'\t' read -r id ref; do
            case "$ref" in
              "refs/tags/$TAG") tagged="$id" ;;
              "refs/tags/$TAG^{}") peeled="$id" ;;
            esac
          done <<< "$listing"
          found="${tagged:-$peeled}"'''
reddens = [
  "tests/test_check_workflow.py::test_the_gated_step_compares_the_peeled_id[annotated-publish]",
  "tests/test_check_workflow.py::test_the_gated_step_compares_the_peeled_id[annotated-tag-object-publish]",
]

