# The tooling group: the repository's own scripts and its CI workflows — the mutation oracle, the
# release and artifact checks, and the jobs under `.github/`.
# Which group an entry belongs in is `GROUP_OF` in `scripts/mutation_oracle.py`; what an entry is:
# CONTRIBUTING.md, "Tests".

# The oracle's own two guards, declared here like any other. Self-mutation works because
# `_check` rewrites the file on disk and the run it then launches is a subprocess that loads
# this script fresh from that path — the parent's already-imported copy decides nothing.
[[mutation]]
name = "the oracle stops proving the named tests pass before it mutates"
file = "scripts/mutation_oracle.py"
before = '    if not clean.passed:'
after = '    if False:'
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_a_test_id_that_does_not_exist_is_a_finding_not_a_catch",
  "tests/scripts/test_mutation_oracle.py::test_a_run_where_every_named_test_skipped_proves_nothing",
]

[[mutation]]
name = "the oracle reads a git that could not answer as a clean tree again"
file = "scripts/mutation_oracle.py"
before = '    if status.returncode != 0:'
after = '    if False:'
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_a_tree_git_cannot_answer_about_is_refused_not_assumed_clean",
]

# Both smoke scripts build a session on one base environment that strips every `STAYFIXED_*`
# variable; the suite's floor is the one it keeps, or their entries run under the bare bounds the
# floor exists to lift.
[[mutation]]
name = "the hook smoke strips the suite's floor"
file = "scripts/smoke_hooks.py"
before = """        if k == FLOOR_VARIABLE or not k.startswith(("STAYFIXED_", "XDG_", "CLAUDE_", "PLUGIN_"))"""
after = """        if not k.startswith(("STAYFIXED_", "XDG_", "CLAUDE_", "PLUGIN_"))"""
reddens = [
  "tests/scripts/test_smoke_scripts.py::test_a_hook_entry_keeps_the_suite_floor_and_no_other_stayfixed_variable",
]

# The oracle proves HEAD in a detached worktree. Three entries are on the run itself — this one,
# `mutations/`'s "the scratch checkout's src no longer precedes the editable install" and "the
# dirty-tree sweep forgets the tests every entry names" — so a regression to in-place mutation, or a
# scratch `src` that does not precede the editable install on sys.path, or a dirty-tree sweep that
# forgets the named tests, is a finding rather than a quiet wrong answer.
[[mutation]]
name = "the oracle collects pytest from the working tree again"
file = "scripts/mutation_oracle.py"
before = "            cwd=cwd,"
after = "            cwd=ROOT,"
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_the_working_tree_is_never_written_and_pytest_runs_in_the_scratch_checkout",
]

# The oracle's own pytest run captured stdout with a strict decode that nothing needed: a
# failing test whose diff carried a latin-1 byte killed the run on a mutation it had caught.
[[mutation]]
name = "the oracle decodes pytest's output strictly again"
file = "scripts/mutation_oracle.py"
before = """                # reads — a strict decode then killed the run on a mutation it had caught.
                stdout=subprocess.PIPE,
                stderr=subprocess.PIPE,"""
after = """                # reads — a strict decode then killed the run on a mutation it had caught.
                stdout=subprocess.PIPE,
                stderr=subprocess.PIPE,
                text=True,"""
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_a_red_test_that_prints_an_undecodable_byte_is_still_reported_caught",
]

# The same strict decode in the other pytest the oracle launches: the collection that warms the
# bytecode cache forgives only a timeout, so a byte no codec reads there ended the run.
[[mutation]]
name = "the oracle decodes its warming collection's output strictly again"
file = "scripts/mutation_oracle.py"
before = """            # cache, and a byte no codec reads in the collection's output killed the oracle.
            capture_output=True,"""
after = """            # cache, and a byte no codec reads in the collection's output killed the oracle.
            capture_output=True,
            text=True,"""
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_a_collection_that_prints_an_undecodable_byte_still_warms_the_cache",
]

# Two more on the run itself, beside `mutations/`'s "the oracle collects pytest from the working
# tree again": the scratch checkout's `src` precedes the editable install, and an uncommitted test a
# `reddens` names stops the run.
[[mutation]]
name = "the scratch checkout's src no longer precedes the editable install"
file = "scripts/mutation_oracle.py"
before = '    pythonpath = str(cwd / "src") + (os.pathsep + inherited if inherited else "")'
after = "    pythonpath = inherited"
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_the_scratch_copy_wins_over_a_main_checkout_already_on_the_path",
]

[[mutation]]
name = "the dirty-tree sweep forgets the tests every entry names"
file = "scripts/mutation_oracle.py"
before = "    watched = {m.file for m in mutations} | {path for path in named_tests if path.is_file()}"
after = "    watched = {m.file for m in mutations}"
reddens = [
  "tests/scripts/test_mutation_oracle.py::test_an_uncommitted_reddens_test_file_is_refused_like_an_uncommitted_source_file",
]

# The built artifact's modes. `tar` preserves the mode and a downstream packager unpacks it: a
# wrapper at 0644 exits 126 for every hook entry, which Claude Code reports as a permission error
# rather than as a broken install. Nothing in `tests/` can see this — only the built artifact can.
[[mutation]]
name = "the sdist check stops reading the wrapper's mode"
file = "scripts/check_artifacts.py"
before = "        if member is not None and member.mode & 0o111 == 0:"
after = "        if False:"
reddens = [
  "tests/scripts/test_check_artifacts.py::test_a_wrapper_that_lost_its_executable_bit_in_the_sdist_is_named",
]

# `overlay create --local` leaves a git repository, and the rendered check asks for it rather than
# stepping over it: a tree that is exact but has no `.git/` is a `--local` that stopped initialising.
[[mutation]]
name = "the rendered check stops asking for the repository"
file = "scripts/check_artifacts.py"
before = '        ([] if inside else ["rendered: missing .git"])'
after = "        []"
reddens = [
  "tests/scripts/test_check_artifacts.py::test_a_rendered_overlay_is_a_repository_and_a_tree_without_one_fails",
]

# And the walk sets aside the repository directory only, not everything that shares its prefix.
[[mutation]]
name = "the rendered walk skips every path that starts with .git"
file = "scripts/check_artifacts.py"
before = "        if p.is_file() and not (inside and p.is_relative_to(repository))"
after = '        if p.is_file() and not p.relative_to(root).parts[0].startswith(".git")'
reddens = [
  "tests/scripts/test_check_artifacts.py::test_the_repository_directory_does_not_hide_an_unexpected_file_beside_it",
]

# `rendered` with the directory omitted used to be reinterpreted as a dist path: the length check
# was part of the arm's condition, so a bare `rendered` fell through and was globbed as a directory
# name.
[[mutation]]
name = "a rendered with no directory is globbed as a dist path again"
file = "scripts/check_artifacts.py"
before = '    if argv[:1] == ["rendered"]:'
after = '    if argv[:1] == ["rendered"] and len(argv) == 2:'
reddens = [
  "tests/scripts/test_check_artifacts.py::test_rendered_without_a_directory_is_the_usage_message_and_not_a_dist_walk",
]

# A `${{ }}` inside a workflow's `run:` is interpolated by the platform before the shell sees
# the script, so a branch name or a pull-request title carrying shell metacharacters runs as the
# workflow's own code. Every value in these files reaches a shell through `env:` instead, and
# that is a rule nothing but this scan can hold: the repository carries no YAML parser, so a
# workflow is otherwise proven only by the run that first executes it.
[[mutation]]
name = "a workflow splices an expression into a shell"
file = ".github/workflows/check.yml"
before = '          actual="$(git -C stayfixed rev-parse HEAD)"'
after = '          actual="$(git -C stayfixed rev-parse ${{ github.ref }})"'
reddens = [
  "tests/test_fixtures.py::test_no_workflow_splices_an_expression_into_a_shell",
]

# The checkout step peels the ref the platform names to its commit before comparing it with the
# commit the gates are handed.
[[mutation]]
name = "the checkout step compares the platform's workflow sha without peeling it"
file = ".github/workflows/check.yml"
before = """expected="$(git -C stayfixed rev-parse --verify --quiet "$EXPECTED^{commit}")""""
after = """expected="$EXPECTED" && [ -n "$expected" ]"""
reddens = [
  "tests/test_check_workflow.py::test_the_checkout_step_peels_an_annotated_tag_to_the_commit_the_gates_are_handed",
]

# The hook smoke is the only thing that feeds the INSTALLED plugin a real event, and every one
# of its rows is an exit-code comparison. Drop the comparison and the closed `PreToolUse` entry
# reports `ok` while exiting 0 — a plugin whose refusal has stopped refusing, reported green.
[[mutation]]
name = "the hook smoke stops comparing exit codes"
file = "scripts/smoke_hooks.py"
before = "    if done.returncode != sample.expected_code:"
after = "    if False:"
reddens = [
  "tests/scripts/test_smoke_scripts.py::test_a_wrapper_that_answers_wrongly_is_reported",
]

# And the same question asked of the other script. Every row but the first in the exfiltration
# scenario asserts an ABSENCE, and a scenario whose pipeline is broken prints the same
# absences — so the first row is a positive control, and a control nothing holds to its own
# result is decoration. This mutation blinds THAT ROW and nothing else: the control stops being
# able to notice that the note never arrived, so the scenario reports success over a store that
# emitted nothing while the four absence rows stay green, which is exactly the shape the control
# exists to catch. (An earlier form pinned `Report.failures` to zero, which made every row
# unfailable and so claimed more than the control's own argument needed.)
[[mutation]]
name = "the exfiltration scenario's positive control cannot fail"
file = "scripts/smoke_exfiltration.py"
before = "        and CANARY in emitted.stdout"
after = "        and True"
reddens = [
  "tests/scripts/test_smoke_scripts.py::test_the_exfiltration_scenario_reports_a_row_that_went_the_wrong_way",
]

# The smoke job's `grep -qx` is the CI side of each script's own floor, and a hand-kept copy of
# the counts went stale once already: the hooks file lost four entries, the script and the suite
# agreed on the new counts, and the job failed on every pull request. Each guard derives the line
# from the script's constants; these put back a count the script no longer prints.
[[mutation]]
name = "the smoke job demands a hook summary the script no longer prints"
file = ".github/workflows/smoke.yml"
before = '          grep -qx "9 entries, 10 row(s), 0 failure(s)" "$RUNNER_TEMP/hooks.out"'
after = '          grep -qx "13 entries, 14 row(s), 0 failure(s)" "$RUNNER_TEMP/hooks.out"'
reddens = [
  "tests/test_check_workflow.py::test_the_smoke_job_demands_the_summary_the_hook_script_prints_over_every_entry",
]

[[mutation]]
name = "the smoke job demands an exfiltration summary the scenario no longer prints"
file = ".github/workflows/smoke.yml"
before = '          grep -qx "9 row(s), 0 failure(s)" "$RUNNER_TEMP/hostile.out"'
after = '          grep -qx "8 row(s), 0 failure(s)" "$RUNNER_TEMP/hostile.out"'
reddens = [
  "tests/test_check_workflow.py::test_the_smoke_job_demands_the_summary_the_exfiltration_scenario_prints_over_every_row",
]

# The plugin is published from a repository of its own whose root is the tree
# `scripts/plugin_tree.py render` writes, so the workflows that judge the plugin judge a render of
# this commit, and this repository's catalog where it is. Each of these weakens one of those
# judgements: it points a step at something other than this commit's render (the checkout, or
# another commit), drops or empties a step that ties the render to what is validated, installed,
# attested or released, stops validating the catalog, or lets the release go on without the
# plugin's manifest.
[[mutation]]
name = "the smoke installs the checkout again"
file = ".github/workflows/smoke.yml"
