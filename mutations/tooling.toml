# An interrupted run left a `git worktree` registration that `git worktree prune` will not take,
# because prune only drops entries whose directory is gone and the `mkdtemp` tree is still standing.
# One was live in the development repository at review time, 6.5 MB.
#
# The mutation is the `rmtree` and not the `worktree remove` beside it, and the unfiltered run
# is what said so: with the directory gone, the `prune` at the end of the sweep collects the
# registration by itself, so removing `worktree remove` changed no outcome this test can see
# and the entry survived. `rmtree` is the line the leak is really about — the tree on disk.
[[mutation]]
name = "the scratch sweep leaves the leaked tree on disk"
file = "scripts/mutation_oracle.py"
before = """
        _git("worktree", "remove", "--force", str(tree))
