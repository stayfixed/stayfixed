reddens = [
  "tests/test_check_workflow.py::test_the_smoke_job_demands_the_summary_the_hook_script_prints_over_every_entry",
]

[[mutation]]
name = "the smoke job demands an exfiltration summary the scenario no longer prints"
file = ".github/workflows/smoke.yml"
before = '          grep -qx "9 row(s), 0 failure(s)" "$RUNNER_TEMP/hostile.out"'
after = '          grep -qx "8 row(s), 0 failure(s)" "$RUNNER_TEMP/hostile.out"'
reddens = [
  "tests/test_check_workflow.py::test_the_smoke_job_demands_the_summary_the_exfiltration_scenario_prints_over_every_row",
]

# `inputs.path` is appended to `$GITHUB_OUTPUT`, which the runner parses line by line, so a
# `path:` carrying a newline writes further `key=value` lines — and the key the gate steps read
# is `base_sha`, the commit whose configuration governs the gates. Disable the character check
# and a caller's `path:` forges that commit, and with it what a pull request is judged against.
[[mutation]]
name = "the reusable workflow lets `path:` write its own outputs"
file = ".github/workflows/check.yml"
before = "            *[!A-Za-z0-9._/-]*)"
after = "            unmatchable-pattern-that-is-never-a-path)"
reddens = [
  "tests/test_fixtures.py::test_a_path_input_cannot_write_the_steps_own_outputs",
]

# The hook smoke's guard held one direction: it caught `hooks.json` gaining an event with no
# sample, and not `hooks.json` losing one — which shrinks the walk, runs fewer rows and prints a
# green summary. With this mutation every remaining row still passes and `main` returns 0, so
# the exit code and the sentence are both the claim.
[[mutation]]
name = "the hook smoke stops noticing an event that lost its entry"
file = "scripts/smoke_hooks.py"
before = "    unentered = SAMPLES.keys() - events"
after = "    unentered = SAMPLES.keys() - SAMPLES.keys()"
reddens = [
  "tests/scripts/test_smoke_scripts.py::test_hooks_json_losing_an_event_fails_instead_of_running_fewer_rows",
]

# `environment: pypi` is a human gate only if the environment has protection rules, and GitHub
# auto-creates an environment a job names and the repository lacks with none on it.
