# The installed CLI's frame gives every command its `help=` sentence as its description; the
# release script has its own parser and no frame, and each command's `--help` opened with
# `usage:` and went straight to the options.
[[mutation]]
name = "the release script's commands open their help with no description again"
file = "scripts/release.py"
before = '        return sub.add_parser(name, help=sentence, description=sentence, epilog=JSON_EPILOG)'
after = '        return sub.add_parser(name, help=sentence, epilog=JSON_EPILOG)'
reddens = ["tests/scripts/test_release.py::test_every_command_opens_its_own_help_with_what_it_does"]

