# The reusable workflow's time limit is the caller's to move, and the caller is pull-request
# content: the expression reads the caller's value only inside 5 to 60, so the input cannot give
# one run of this job more than an hour.
[[mutation]]
name = "the reusable workflow's time limit reaches ten hours"
file = ".github/workflows/check.yml"
before = "    timeout-minutes: ${{ inputs.timeout-minutes >= 5 && inputs.timeout-minutes <= 60 && inputs.timeout-minutes || 15 }}"
after = "    timeout-minutes: ${{ inputs.timeout-minutes >= 5 && inputs.timeout-minutes <= 600 && inputs.timeout-minutes || 15 }}"
reddens = [
  "tests/test_check_workflow.py::test_the_job_s_time_limit_is_an_input_the_expression_holds_inside_its_bounds",
]

# A value outside the range would otherwise run silently under the default the expression stands
# in for it: the caller asked for a bound it did not get. The first step refuses it.
